# Public demo of the SellCraft landing page (no backend, no model). The full app runs locally; see the README.
services:
  - type: web
    name: mochi-demo
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_DEMO_ONLY
        value: "1"
      - key: NODE_VERSION
        value: "22"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=460"  # the free plan has 512 MB; keeps the Next.js build from running out of memory
