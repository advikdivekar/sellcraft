<svg style="color:#1b1815;background:#ffffff;max-width:100%;height:auto" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 860" role="img" aria-label="The three SQLite tables, the HTTP routes grouped by purpose, and the job state machine" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Data model and API</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" fill-opacity="0.75"/></marker><marker id="arr-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="currentColor" fill-opacity="0.75"/></marker><marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="arr-a-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#ea580c"/></marker></defs><rect x="20" y="50" width="470" height="560" rx="12" fill="none" stroke="currentColor" stroke-opacity="0.28" stroke-dasharray="5 5"/><text x="34" y="72" font-size="11" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="0.55">SQLITE (DATA/SELLCRAFT.DB)</text><rect x="40" y="90" width="430" height="150" rx="8" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-opacity="0.55"/><line x1="40" y1="106" x2="470" y2="106" stroke="currentColor" stroke-opacity="0.3"/><text x="255.0" y="102" font-size="11" font-weight="700" text-anchor="middle" fill="currentColor" fill-opacity="0.8">jobs</text><text x="255.0" y="126" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">id · status · created_at · updated_at</text><text x="255.0" y="141" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">product (JSON) · settings (JSON)</text><text x="255.0" y="156" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">copy_output (JSON) · copy_source</text><text x="255.0" y="171" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">error (JSON) · stages (JSON list)</text><rect x="40" y="260" width="430" height="150" rx="8" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-opacity="0.55"/><line x1="40" y1="276" x2="470" y2="276" stroke="currentColor" stroke-opacity="0.3"/><text x="255.0" y="272" font-size="11" font-weight="700" text-anchor="middle" fill="currentColor" fill-opacity="0.8">assets</text><text x="255.0" y="296" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">id · job_id · kind · mime · path · created_at</text><text x="255.0" y="311" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">method · duration_seconds</text><text x="255.0" y="326" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">kinds: image · studio_image · catalog_image · cutout_image</text><text x="255.0" y="341" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">deck_slide · clip · video  (UUID file names on disk)</text><rect x="40" y="430" width="430" height="150" rx="8" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-opacity="0.55"/><line x1="40" y1="446" x2="470" y2="446" stroke="currentColor" stroke-opacity="0.3"/><text x="255.0" y="442" font-size="11" font-weight="700" text-anchor="middle" fill="currentColor" fill-opacity="0.8">connections</text><text x="255.0" y="466" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">provider (PK) · label · created_at</text><text x="255.0" y="481" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">secret_enc: Fernet-encrypted token</text><text x="255.0" y="496" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">meta (JSON)  — secrets never returned by any API</text><text x="255.0" y="511" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">key: SECRET_KEY or data/.secret (mode 0600)</text><rect x="530" y="50" width="560" height="560" rx="12" fill="none" stroke="currentColor" stroke-opacity="0.28" stroke-dasharray="5 5"/><text x="544" y="72" font-size="11" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="0.55">HTTP API (FASTAPI, /API)</text><rect x="550" y="90" width="520" height="68" rx="8" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.4"/><text x="566" y="110" font-size="11" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="0.6">UPLOADS</text><text x="566" y="132" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1.0">POST /uploads  (≤10 MB, type from bytes)</text><text x="566" y="152" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1.0">POST /uploads/analyze  (photo reading)</text><rect x="550" y="170" width="520" height="88" rx="8" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.4"/><text x="566" y="190" font-size="11" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="0.6">GENERATIONS</text><text x="566" y="212" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1.0">POST /generations → 202, job id</text><text x="566" y="232" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1.0">GET /generations/{id}  (poll: state, partial copy, assets)</text><text x="566" y="252" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1.0">POST …/retry · …/reassemble (202)</text><rect x="550" y="270" width="520" height="88" rx="8" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.4"/><text x="566" y="290" font-size="11" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="0.6">COPY</text><text x="566" y="312" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1.0">PATCH …/copy  (saved on blur)</text><text x="566" y="332" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1.0">POST …/regenerate-copy  (one section)</text><text x="566" y="352" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1.0">POST …/report  (fixed reason codes)</text><rect x="550" y="370" width="520" height="68" rx="8" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.4"/><text x="566" y="390" font-size="11" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="0.6">EXPORT</text><text x="566" y="412" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1.0">GET …/assets/{asset_id}  (scoped to its job)</text><text x="566" y="432" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1.0">GET …/kit.zip  · POST …/publish/shopify (draft)</text><rect x="550" y="450" width="520" height="68" rx="8" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.4"/><text x="566" y="470" font-size="11" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="0.6">OTHER</text><text x="566" y="492" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1.0">GET/POST/DELETE /connections/shopify</text><text x="566" y="512" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1.0">GET /health · /providers/status · /access</text><rect x="1130" y="50" width="470" height="560" rx="12" fill="none" stroke="currentColor" stroke-opacity="0.28" stroke-dasharray="5 5"/><text x="1144" y="72" font-size="11" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="0.55">JOB STATE MACHINE</text><rect x="1160" y="90" width="410" height="46" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1365.0" y="116.0" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">queued</text><rect x="1160" y="170" width="410" height="46" rx="8" fill="#ea580c" fill-opacity="0.1" stroke="#ea580c" stroke-opacity="0.95"/><text x="1365.0" y="196.0" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">generating_copy + generating_video (together)</text><rect x="1160" y="250" width="410" height="46" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1365.0" y="276.0" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">deck (inside the video stage)</text><rect x="1160" y="330" width="410" height="46" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1365.0" y="356.0" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">assembling_video</text><rect x="1160" y="410" width="410" height="46" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1365.0" y="436.0" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">completed</text><polyline points="1365,136 1365,170" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><polyline points="1365,216 1365,250" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><polyline points="1365,296 1365,330" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><polyline points="1365,376 1365,410" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><rect x="1160" y="490" width="190" height="46" rx="8" fill="currentColor" fill-opacity="0.02" stroke="currentColor" stroke-opacity="0.55" stroke-dasharray="4 4"/><text x="1255.0" y="516.0" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="0.55">failed</text><text x="1366" y="506" font-size="11" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.8">retryable → &#x27;Try again&#x27;</text><text x="1366" y="524" font-size="11" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.8">skips a copy that already finished</text><polyline points="1580,300 1590,300 1590,513 1350,513" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/><text x="20" y="664" font-size="13" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="1.0">Design choices</text><text x="20" y="690" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">•  Everything is a polling job: the UI asks for the job every 1.5 s, and the server computes overall progress from the real state of each stage, never from a timer.</text><text x="20" y="714" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">•  Stages are independent functions, so they can move to a worker later; today they run in a background thread, which means a restart loses an in-flight job.</text><text x="20" y="738" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">•  Files are named by UUID and served only through their job&#x27;s route, so one job cannot read another&#x27;s assets. Uploads are checked by their bytes, not their extension.</text><text x="20" y="762" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">•  The Shopify token lives only on the backend, encrypted at rest, and is never sent to the browser. Publishing creates a draft; going live is a separate step in Shopify.</text><text x="20" y="786" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">•  There are no user accounts: connections belong to the installation, so it is meant for one seller, behind the access code when shared.</text></svg>