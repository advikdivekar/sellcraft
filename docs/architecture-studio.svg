<svg style="color:#1b1815;background:#ffffff;max-width:100%;height:auto" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 800" role="img" aria-label="Each photo is measured, cut out, retouched on the product pixels only, placed on a backdrop chosen from the photo, and rendered into studio stills, marketplace photos, a transparent PNG, deck slides and video layers" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Photo refinement pipeline</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" fill-opacity="0.75"/></marker><marker id="arr-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="currentColor" fill-opacity="0.75"/></marker><marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="arr-a-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#ea580c"/></marker></defs><rect x="20" y="50" width="1580" height="330" rx="12" fill="none" stroke="#ea580c" stroke-opacity="0.9" stroke-dasharray="5 5"/><text x="34" y="72" font-size="11" font-weight="700" text-anchor="start" fill="#ea580c" fill-opacity="1">PER PHOTO (UP TO 3 PHOTOS PREPARED IN PARALLEL)</text><rect x="40" y="90" width="236" height="140" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="158.0" y="141.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">1  Measure</text><text x="158.0" y="159.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">sharpness · brightness</text><text x="158.0" y="174.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">noise · product size</text><text x="158.0" y="189.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">→ warnings, never hidden</text><rect x="298" y="90" width="236" height="140" rx="8" fill="#ea580c" fill-opacity="0.1" stroke="#ea580c" stroke-opacity="0.95"/><text x="416.0" y="141.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">2  Cut out</text><text x="416.0" y="159.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">rembg silueta on a ≤1400 px copy</text><text x="416.0" y="174.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">alpha scaled to the full-res photo</text><text x="416.0" y="189.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">keeps the main subject only</text><polyline points="276,160 298,160" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><rect x="556" y="90" width="236" height="140" rx="8" fill="#ea580c" fill-opacity="0.1" stroke="#ea580c" stroke-opacity="0.95"/><text x="674.0" y="141.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">3  Refine product</text><text x="674.0" y="159.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">denoise (strength from noise)</text><text x="674.0" y="174.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">2× super-res if few pixels</text><text x="674.0" y="189.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">CLAHE only on textured areas</text><polyline points="534,160 556,160" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><rect x="814" y="90" width="236" height="140" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="932.0" y="141.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">4  Fix tone</text><text x="932.0" y="159.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">colour cast + exposure,</text><text x="932.0" y="174.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">measured on the product,</text><text x="932.0" y="189.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">capped · edge halo removed</text><polyline points="792,160 814,160" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><rect x="1072" y="90" width="236" height="140" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1190.0" y="141.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">5  Pick backdrop</text><text x="1190.0" y="159.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">from what the photo shows:</text><text x="1190.0" y="174.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">dark product → lighter backdrop</text><text x="1190.0" y="189.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">warm + bold → cool backdrop</text><polyline points="1050,160 1072,160" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><rect x="1330" y="90" width="236" height="140" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1448.0" y="141.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">6  Compose</text><text x="1448.0" y="159.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">style gradient · spotlight</text><text x="1448.0" y="174.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">contact shadow · reflection</text><text x="1448.0" y="189.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">bokeh (warm style only)</text><polyline points="1308,160 1330,160" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><rect x="40" y="270" width="360" height="80" rx="8" fill="currentColor" fill-opacity="0.02" stroke="currentColor" stroke-opacity="0.55" stroke-dasharray="4 4"/><text x="220.0" y="298.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="0.55">If no clean subject is found</text><text x="220.0" y="316.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">coverage &lt; 4% or &gt; 96%: the photo is shown as a</text><text x="220.0" y="331.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">framed photo and the app says why</text><polyline points="318,230 318,250 220,250 220,270" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/><text x="420" y="320" font-size="12" font-weight="400" text-anchor="start" fill="#ea580c" fill-opacity="0.9">The product pixels are retouched but never repainted: labels, logos and shape stay true.</text><text x="420" y="340" font-size="12" font-weight="400" text-anchor="start" fill="#ea580c" fill-opacity="0.9">Everything here is deterministic image processing. No generative model touches the photo.</text><rect x="20" y="410" width="1580" height="220" rx="12" fill="none" stroke="currentColor" stroke-opacity="0.28" stroke-dasharray="5 5"/><text x="34" y="432" font-size="11" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="0.55">WHAT EACH PHOTO PRODUCES</text><rect x="40" y="450" width="292" height="150" rx="8" fill="#ea580c" fill-opacity="0.1" stroke="#ea580c" stroke-opacity="0.95"/><text x="186.0" y="513.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Studio still</text><text x="186.0" y="531.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">1080 × 1350 (4:5 feed)</text><text x="186.0" y="546.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">on the designed backdrop</text><rect x="352" y="450" width="292" height="150" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="498.0" y="513.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Marketplace photo</text><text x="498.0" y="531.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">white background, 1600 px</text><text x="498.0" y="546.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">(Amazon / Etsy style)</text><rect x="664" y="450" width="292" height="150" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="810.0" y="513.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Transparent PNG</text><text x="810.0" y="531.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">the refined product only</text><text x="810.0" y="546.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">reused by the deck</text><rect x="976" y="450" width="292" height="150" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1122.0" y="513.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Video layers</text><text x="1122.0" y="531.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">product layer + oversized</text><text x="1122.0" y="546.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">backdrop for parallax</text><rect x="1288" y="450" width="292" height="150" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1434.0" y="513.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Image deck</text><text x="1434.0" y="531.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">hero · benefits · close-up</text><text x="1434.0" y="546.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">angles · CTA, from the copy</text><polyline points="1448,230 1448,450" fill="none" stroke="#ea580c" stroke-opacity="1" stroke-width="2" marker-end="url(#arr-a)"/><text x="1474.0" y="380.0" font-size="11" font-weight="400" text-anchor="middle" fill="#ea580c" fill-opacity="1" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">render</text><text x="20" y="668" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">Photo problems are reported in the UI, not hidden: blur, low resolution, product too small, and slides that were skipped (for example the close-up).</text><text x="20" y="690" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">The benefits slide uses only benefits the seller gave or confirmed; with fewer than two it is skipped and the app says why.</text><text x="20" y="712" font-size="12" font-weight="400" text-anchor="start" fill="#ea580c" fill-opacity="0.9">Sample time: refining 4 photos and rendering the shots takes about 12–17 s on an 18 GB Apple-silicon Mac, in parallel with the copy.</text></svg>