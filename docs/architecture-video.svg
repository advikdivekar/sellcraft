<svg style="color:#1b1815;background:#ffffff;max-width:100%;height:auto" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 600" role="img" aria-label="Refined layers are planned into at least four camera-move shots, rendered in parallel with FFmpeg, crossfaded, given text cards from the copy, validated and exported; a copy edit re-renders only the text" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Video pipeline</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" fill-opacity="0.75"/></marker><marker id="arr-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="currentColor" fill-opacity="0.75"/></marker><marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="arr-a-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#ea580c"/></marker></defs><rect x="20" y="100" width="200" height="130" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="120.0" y="146.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Refined layers</text><text x="120.0" y="164.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">product layer + backdrop</text><text x="120.0" y="179.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">per photo, from the</text><text x="120.0" y="194.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">photo pipeline</text><rect x="260" y="100" width="220" height="130" rx="8" fill="#ea580c" fill-opacity="0.1" stroke="#ea580c" stroke-opacity="0.95"/><text x="370.0" y="138.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Plan the shots</text><text x="370.0" y="156.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">1 photo: push · detail · pull · hero</text><text x="370.0" y="171.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">2+ photos: start and end on the</text><text x="370.0" y="186.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">hero; middle shots detail · pull · sway</text><text x="370.0" y="201.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">always ≥ 4 shots</text><rect x="520" y="100" width="260" height="130" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="650.0" y="138.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Render each shot (FFmpeg)</text><text x="650.0" y="156.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">backdrop drifts slower than the</text><text x="650.0" y="171.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">product = parallax; product scales</text><text x="650.0" y="186.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">and pans; light sweep on push/hero</text><text x="650.0" y="201.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">up to 3 shots at once</text><rect x="820" y="100" width="200" height="130" rx="8" fill="#ea580c" fill-opacity="0.1" stroke="#ea580c" stroke-opacity="0.95"/><text x="920.0" y="146.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Crossfade</text><text x="920.0" y="164.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">xfade 0.4 s between shots</text><text x="920.0" y="179.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">shot length = (10 + 0.4·(k−1)) / k</text><text x="920.0" y="194.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">→ motion clip, no text yet</text><rect x="1060" y="100" width="250" height="130" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1185.0" y="138.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Text cards (Pillow)</text><text x="1185.0" y="156.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">hook 0.25–2 s · feature 6–8 s</text><text x="1185.0" y="171.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">name + CTA 8–10 s, fade in</text><text x="1185.0" y="186.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">fonts fitted to the frame, from</text><text x="1185.0" y="201.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">the edited copy</text><rect x="1350" y="100" width="250" height="130" rx="8" fill="#ea580c" fill-opacity="0.1" stroke="#ea580c" stroke-opacity="0.95"/><text x="1475.0" y="138.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Validate + export</text><text x="1475.0" y="156.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">ffprobe: 10 s ± 0.5, 1080×1920</text><text x="1475.0" y="171.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">H.264 yuv420p, faststart</text><text x="1475.0" y="186.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">plays on iPhone Safari</text><text x="1475.0" y="201.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">bad file → fail with a reason</text><polyline points="220,165 260,165" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><polyline points="480,165 520,165" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><polyline points="780,165 820,165" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><polyline points="1020,165 1060,165" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><polyline points="1310,165 1350,165" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><text x="20" y="290" font-size="13" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="1.0">Edit the copy later: only the text overlay is re-rendered</text><rect x="20" y="320" width="230" height="90" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="135.0" y="361.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Seller edits a field</text><text x="135.0" y="379.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">saved on blur (PATCH /copy)</text><rect x="290" y="320" width="250" height="90" rx="8" fill="#ea580c" fill-opacity="0.1" stroke="#ea580c" stroke-opacity="0.95"/><text x="415.0" y="353.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Reassemble</text><text x="415.0" y="371.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">reuse the stored motion clip,</text><text x="415.0" y="386.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">rebuild deck + cards only</text><rect x="580" y="320" width="250" height="90" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="705.0" y="353.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Swap the video</text><text x="705.0" y="371.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">old file kept until the new</text><text x="705.0" y="386.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">one passes validation</text><polyline points="250,365 290,365" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><polyline points="540,365 580,365" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><text x="20" y="460" font-size="13" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="1.0">What it is, honestly</text><text x="20" y="486" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">•  A motion clip built from the seller&#x27;s own stills with camera moves and text. It is image processing and FFmpeg, not generated footage, and the app says so.</text><text x="20" y="510" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">•  No text-to-video, no actors, no invented scenes. The packaging, labels and logos are the real pixels from the photos.</text><text x="20" y="534" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">•  Typical cost: 12–17 s for 4 photos, in parallel with the copy. Final assembly ≈ 2 s (veryfast encode).</text><text x="20" y="558" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">•  A failed video keeps the copy; &#x27;Try again&#x27; skips the copy step and rebuilds only what failed.</text></svg>