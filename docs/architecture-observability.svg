<svg style="color:#1b1815;background:#ffffff;max-width:100%;height:auto" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 800" role="img" aria-label="Each model call is a traced span, each flagged claim is an issue, and an allow-list scrubber plus a canary test keep seller text out of Sentry" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Observability and privacy</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" fill-opacity="0.75"/></marker><marker id="arr-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="currentColor" fill-opacity="0.75"/></marker><marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="arr-a-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#ea580c"/></marker></defs><rect x="20" y="50" width="520" height="420" rx="12" fill="none" stroke="#ea580c" stroke-opacity="0.9" stroke-dasharray="5 5"/><text x="34" y="72" font-size="11" font-weight="700" text-anchor="start" fill="#ea580c" fill-opacity="1">TRACE OF ONE KIT (SENTRY TRANSACTION)</text><rect x="40" y="90" width="480" height="50" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="280.0" y="118.0" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">generation  (job_id, platforms)</text><rect x="70" y="156" width="450" height="62" rx="8" fill="#ea580c" fill-opacity="0.1" stroke="#ea580c" stroke-opacity="0.95"/><text x="295.0" y="182.5" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">gen_ai.invoke_agent · sellcraft-copy</text><text x="295.0" y="200.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">model · job_id · prompt_version · flags.total / forbidden / risky / regulated</text><rect x="100" y="232" width="420" height="62" rx="8" fill="#ea580c" fill-opacity="0.1" stroke="#ea580c" stroke-opacity="0.95"/><text x="310.0" y="258.5" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">gen_ai.chat × (4 + N)   one per model call</text><text x="310.0" y="276.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">model · input/output tokens · tokens per second · latency_ms</text><rect x="70" y="310" width="450" height="40" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="295.0" y="333.0" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">video.clip   ·   deck.build   ·   video.assemble</text><text x="40" y="384" font-size="11" font-weight="400" text-anchor="start" fill="#ea580c" fill-opacity="0.85">Prompt and reply are NEVER attached: they hold the seller&#x27;s facts.</text><text x="40" y="404" font-size="11" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.75">SENTRY_DSN empty → every call is a no-op.</text><rect x="580" y="50" width="480" height="420" rx="12" fill="none" stroke="currentColor" stroke-opacity="0.28" stroke-dasharray="5 5"/><text x="594" y="72" font-size="11" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="0.55">EVENTS (ISSUES)</text><rect x="600" y="90" width="440" height="100" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="820.0" y="121.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Flagged claim, one issue per rule</text><text x="820.0" y="139.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">tags: flag.kind (forbidden · risky · regulated),</text><text x="820.0" y="154.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">flag.term, model, prompt_version</text><text x="820.0" y="169.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">→ a regression after a model swap shows up as a chart</text><rect x="600" y="210" width="440" height="100" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="820.0" y="241.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Seller report</text><text x="820.0" y="259.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">&#x27;The copy still made something up&#x27;</text><text x="820.0" y="274.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">section + a fixed reason code, job_id</text><text x="820.0" y="289.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">no free text (it could carry facts)</text><rect x="600" y="330" width="440" height="110" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="820.0" y="366.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">What a trace answers</text><text x="820.0" y="384.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">which stage was slowest (copy vs video)</text><text x="820.0" y="399.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">tokens per second for each model</text><text x="820.0" y="414.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">which model + prompt version raised a flag</text><rect x="1100" y="50" width="500" height="420" rx="12" fill="none" stroke="#ea580c" stroke-opacity="0.9" stroke-dasharray="5 5"/><text x="1114" y="72" font-size="11" font-weight="700" text-anchor="start" fill="#ea580c" fill-opacity="1">PRIVACY: ALLOW-LIST SCRUBBER (BEFORE SEND)</text><rect x="1120" y="90" width="460" height="80" rx="8" fill="#ea580c" fill-opacity="0.1" stroke="#ea580c" stroke-opacity="0.95"/><text x="1350.0" y="118.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Removed</text><text x="1350.0" y="136.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">request, user, extras, breadcrumbs, local variables,</text><text x="1350.0" y="151.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">any span data or tag not on the allow-list</text><rect x="1120" y="190" width="460" height="80" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1350.0" y="218.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Exception text</text><text x="1350.0" y="236.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">blank unless it is our own AppError</text><text x="1350.0" y="251.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">(pydantic messages can echo submitted values)</text><rect x="1120" y="290" width="460" height="150" rx="8" fill="#ea580c" fill-opacity="0.1" stroke="#ea580c" stroke-opacity="0.95"/><text x="1350.0" y="338.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Canary test (tests/test_tracing.py)</text><text x="1350.0" y="356.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">pushes a unique marker through the facts and the</text><text x="1350.0" y="371.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">model output; fails if it appears in ANY envelope</text><text x="1350.0" y="386.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">the SDK would send. Also checks that the</text><text x="1350.0" y="401.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">useful metadata does get through.</text><polyline points="540,195 580,195" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><text x="560.0" y="187.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.85" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">events</text><polyline points="1060,250 1100,250" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><text x="1080.0" y="242.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.85" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">scrub</text><rect x="20" y="520" width="520" height="90" rx="8" fill="currentColor" fill-opacity="0.02" stroke="currentColor" stroke-opacity="0.55" stroke-dasharray="4 4"/><text x="280.0" y="553.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="0.55">Sentry (cloud, optional)</text><text x="280.0" y="571.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">receives scrubbed metadata only</text><text x="280.0" y="586.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">traces, flag issues, reports</text><polyline points="1340,470 1340,495 280,495 280,520" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/><text x="810.0" y="487.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.85" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">only what passed the scrubber</text><text x="20" y="660" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">Why this matters for a seller tool: the product facts are the seller&#x27;s data. Tracing tells us how the pipeline behaves without ever reading what was sold.</text><text x="20" y="684" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">Every event carries the prompt version, so a prompt edit and a model swap can be told apart.</text><text x="20" y="708" font-size="11" font-weight="400" text-anchor="start" fill="#ea580c" fill-opacity="0.8">Not claimed: that Sentry has caught a production incident. The setup is real and tested; real traces still need screenshots from a running session.</text></svg>