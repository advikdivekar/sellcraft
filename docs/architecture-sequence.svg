<svg style="color:#1b1815;background:#ffffff;max-width:100%;height:auto" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 860" role="img" aria-label="The order of calls from upload to export, including the background job and polling" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Request lifecycle</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" fill-opacity="0.75"/></marker><marker id="arr-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="currentColor" fill-opacity="0.75"/></marker><marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="arr-a-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#ea580c"/></marker></defs><rect x="30" y="40" width="180" height="40" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="120.0" y="63.0" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Browser</text><line x1="120" y1="80" x2="120" y2="780" stroke="currentColor" stroke-opacity="0.25" stroke-dasharray="4 5"/><rect x="300" y="40" width="180" height="40" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="390.0" y="63.0" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Next proxy</text><line x1="390" y1="80" x2="390" y2="780" stroke="currentColor" stroke-opacity="0.25" stroke-dasharray="4 5"/><rect x="570" y="40" width="180" height="40" rx="8" fill="#ea580c" fill-opacity="0.1" stroke="#ea580c" stroke-opacity="0.95"/><text x="660.0" y="63.0" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">FastAPI</text><line x1="660" y1="80" x2="660" y2="780" stroke="currentColor" stroke-opacity="0.25" stroke-dasharray="4 5"/><rect x="840" y="40" width="180" height="40" rx="8" fill="#ea580c" fill-opacity="0.1" stroke="#ea580c" stroke-opacity="0.95"/><text x="930.0" y="63.0" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Job thread</text><line x1="930" y1="80" x2="930" y2="780" stroke="currentColor" stroke-opacity="0.25" stroke-dasharray="4 5"/><rect x="1110" y="40" width="180" height="40" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1200.0" y="63.0" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Ollama</text><line x1="1200" y1="80" x2="1200" y2="780" stroke="currentColor" stroke-opacity="0.25" stroke-dasharray="4 5"/><rect x="1350" y="40" width="180" height="40" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1440.0" y="63.0" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Image + FFmpeg</text><line x1="1440" y1="80" x2="1440" y2="780" stroke="currentColor" stroke-opacity="0.25" stroke-dasharray="4 5"/><text x="20" y="112" font-size="11" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="0.6">1  upload</text><polyline points="120,112 660,112" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><text x="390.0" y="105.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.85" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">POST /uploads ×5 (bytes checked, UUID names)</text><polyline points="660,140 120,140" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/><text x="390.0" y="133.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.85" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">asset ids</text><text x="20" y="176" font-size="11" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="0.6">2  scan</text><polyline points="120,176 660,176" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><text x="390.0" y="169.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.85" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">POST /uploads/analyze</text><polyline points="660,204 1200,204" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><text x="930.0" y="197.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.85" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Gemma 4B + 768 px photos, schema</text><polyline points="1200,232 660,232" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/><text x="930.0" y="225.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.85" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">suggested fields</text><polyline points="660,258 120,258" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/><text x="390.0" y="251.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.85" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">&#x27;From photo · check it&#x27;</text><text x="20" y="294" font-size="11" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="0.6">3  create</text><polyline points="120,294 660,294" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><text x="390.0" y="287.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.85" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">POST /generations (facts + settings)</text><polyline points="660,322 930,322" fill="none" stroke="#ea580c" stroke-opacity="1" stroke-width="2" marker-end="url(#arr-a)"/><text x="795.0" y="315.0" font-size="11" font-weight="400" text-anchor="middle" fill="#ea580c" fill-opacity="1" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">start job (202 + job id)</text><text x="20" y="358" font-size="11" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="0.6">4  work</text><polyline points="930,358 1440,358" fill="none" stroke="#ea580c" stroke-opacity="1" stroke-width="2" marker-end="url(#arr-a)"/><text x="1185.0" y="351.0" font-size="11" font-weight="400" text-anchor="middle" fill="#ea580c" fill-opacity="1" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">video lane: refine · shots</text><polyline points="930,386 1200,386" fill="none" stroke="#ea580c" stroke-opacity="1" stroke-width="2" marker-end="url(#arr-a)"/><text x="1065.0" y="379.0" font-size="11" font-weight="400" text-anchor="middle" fill="#ea580c" fill-opacity="1" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">language lane: 4 + N parts</text><polyline points="1200,414 930,414" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/><text x="1065.0" y="407.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.85" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">parts as they land</text><polyline points="1440,442 930,442" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/><text x="1185.0" y="435.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.85" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">clip ready</text><polyline points="930,470 1440,470" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><text x="1185.0" y="463.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.85" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">deck + text cards + final encode</text><text x="20" y="506" font-size="11" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="0.6">5  poll</text><polyline points="120,506 660,506" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><text x="390.0" y="499.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.85" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">GET /generations/{id} every 1.5 s (via the proxy)</text><polyline points="660,534 120,534" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/><text x="390.0" y="527.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.85" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">state · real progress · partial copy</text><text x="20" y="570" font-size="11" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="0.6">6  results</text><polyline points="120,570 660,570" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><text x="390.0" y="563.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.85" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">GET /assets/{id} (video, deck, photos)</text><text x="20" y="628" font-size="11" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="0.6">7  edit</text><polyline points="120,628 660,628" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><text x="390.0" y="621.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.85" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">PATCH /copy (on blur) · regenerate one section</text><polyline points="120,656 660,656" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><text x="390.0" y="649.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.85" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">POST /reassemble</text><polyline points="660,684 1440,684" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><text x="1050.0" y="677.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.85" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">overlay only, old video kept until valid</text><text x="20" y="740" font-size="11" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="0.6">8  export</text><polyline points="120,740 660,740" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><text x="390.0" y="733.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.85" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">GET /kit.zip  ·  POST /publish/shopify (draft)</text><text x="20" y="800" font-size="11" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.8">The browser only ever talks to the Next proxy (one origin). The FastAPI process is never exposed directly, and every call needs the access code when one is set.</text><text x="20" y="822" font-size="11" font-weight="400" text-anchor="start" fill="#ea580c" fill-opacity="0.8">Sentry spans wrap the job and each model call; they carry metadata only (see the observability figure).</text></svg>