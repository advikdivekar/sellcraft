<svg style="color:#1b1815;background:#ffffff;max-width:100%;height:auto" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 760" role="img" aria-label="The same app runs locally, can be opened on a phone through a tunnel with an access code, and a landing-only build can be deployed publicly with no backend" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Deployment modes and frontend</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" fill-opacity="0.75"/></marker><marker id="arr-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="currentColor" fill-opacity="0.75"/></marker><marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="arr-a-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#ea580c"/></marker></defs><rect x="20" y="50" width="500" height="500" rx="12" fill="none" stroke="#ea580c" stroke-opacity="0.9" stroke-dasharray="5 5"/><text x="34" y="72" font-size="11" font-weight="700" text-anchor="start" fill="#ea580c" fill-opacity="1">A  FULL APP ON YOUR MACHINE</text><rect x="50" y="90" width="440" height="66" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="270.0" y="119.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Browser (laptop)</text><text x="270.0" y="137.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">http://localhost:3000</text><rect x="50" y="180" width="440" height="66" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="270.0" y="209.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Next.js server</text><text x="270.0" y="227.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">UI + /api proxy</text><polyline points="270,156 270,180" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><rect x="50" y="270" width="440" height="66" rx="8" fill="#ea580c" fill-opacity="0.1" stroke="#ea580c" stroke-opacity="0.95"/><text x="270.0" y="299.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">FastAPI :8000</text><text x="270.0" y="317.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">jobs · image + video work</text><polyline points="270,246 270,270" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><rect x="50" y="360" width="440" height="66" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="270.0" y="389.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Ollama :11434</text><text x="270.0" y="407.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">Gemma 3 4B / 12B</text><polyline points="270,336 270,360" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><rect x="50" y="450" width="440" height="66" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="270.0" y="479.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">SQLite + disk</text><text x="270.0" y="497.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">jobs · assets · outputs</text><polyline points="270,426 270,450" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><rect x="560" y="50" width="500" height="500" rx="12" fill="none" stroke="currentColor" stroke-opacity="0.28" stroke-dasharray="5 5"/><text x="574" y="72" font-size="11" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="0.55">B  PHONE, OVER A TUNNEL</text><rect x="590" y="90" width="440" height="66" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="810.0" y="119.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Phone (HTTPS)</text><text x="810.0" y="137.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">camera · share sheet</text><rect x="590" y="180" width="440" height="66" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="810.0" y="209.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Cloudflare quick tunnel</text><text x="810.0" y="227.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">public URL, new each run</text><polyline points="810,156 810,180" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><rect x="590" y="270" width="440" height="66" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="810.0" y="299.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Access gate</text><text x="810.0" y="317.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">random code, 401 without it</text><polyline points="810,246 810,270" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><rect x="590" y="360" width="440" height="66" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="810.0" y="389.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Same app as A</text><text x="810.0" y="407.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">Next → FastAPI → Ollama</text><polyline points="810,336 810,360" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><rect x="590" y="450" width="440" height="66" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="810.0" y="479.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Traffic passes Cloudflare</text><text x="810.0" y="497.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">demo use, not for sensitive data</text><polyline points="810,426 810,450" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><rect x="1100" y="50" width="500" height="500" rx="12" fill="none" stroke="currentColor" stroke-opacity="0.28" stroke-dasharray="5 5"/><text x="1114" y="72" font-size="11" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="0.55">C  PUBLIC DEMO (LANDING PAGE ONLY)</text><rect x="1130" y="90" width="440" height="66" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1350.0" y="119.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Visitor&#x27;s browser</text><text x="1350.0" y="137.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">any device</text><rect x="1130" y="180" width="440" height="66" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1350.0" y="209.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Static Next.js build</text><text x="1350.0" y="227.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">NEXT_PUBLIC_DEMO_ONLY=1</text><polyline points="1350,156 1350,180" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><rect x="1130" y="270" width="440" height="66" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1350.0" y="299.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">In-browser demo studio</text><text x="1350.0" y="317.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">copy assembled locally, labelled</text><polyline points="1350,246 1350,270" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><rect x="1130" y="360" width="440" height="66" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1350.0" y="389.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">No backend, no model</text><text x="1350.0" y="407.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">0 API calls (tested)</text><polyline points="1350,336 1350,360" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><rect x="1130" y="450" width="440" height="66" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1350.0" y="479.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Render web service</text><text x="1350.0" y="497.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">live on the Render free plan</text><polyline points="1350,426 1350,450" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><text x="20" y="590" font-size="13" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="1.0">Frontend routes</text><text x="20" y="616" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">/  landing page: scroll scene, interactive demo studio, channel previews (demo build serves only this)</text><text x="20" y="640" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">/create  3-step wizard: photos (scan + &#x27;Try a sample&#x27;) → facts → style and writing speed;  &#x27;Generate now&#x27; once the scan has filled the name</text><text x="20" y="664" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">/jobs/[id]  live build screen (your photo, scan line, clock, real stage list) → results: Overview · Copy · Photos · Share</text><text x="20" y="688" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">/connections  Shopify draft connection (token checked for write_products, then encrypted)</text><text x="20" y="724" font-size="11" font-weight="400" text-anchor="start" fill="#ea580c" fill-opacity="0.8">Stack: Next.js 16 (App Router), React 19, Tailwind 4, TanStack Query · FastAPI, Pydantic, SQLite · Ollama · FFmpeg, OpenCV, rembg.</text></svg>