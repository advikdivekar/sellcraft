<svg style="color:#1b1815;background:#ffffff;max-width:100%;height:auto" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 660" role="img" aria-label="Which model or tool does which job, where it runs, and which ones are only used offline to build and measure the fine-tune" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Models and what each one does</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" fill-opacity="0.75"/></marker><marker id="arr-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="currentColor" fill-opacity="0.75"/></marker><marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="arr-a-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#ea580c"/></marker></defs><rect x="20" y="50" width="1580" height="230" rx="12" fill="none" stroke="currentColor" stroke-opacity="0.28" stroke-dasharray="5 5"/><text x="34" y="72" font-size="11" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="0.55">RUNS INSIDE THE APP, ON YOUR MACHINE</text><rect x="40" y="90" width="292" height="170" rx="8" fill="#ea580c" fill-opacity="0.1" stroke="#ea580c" stroke-opacity="0.95"/><text x="186.0" y="148.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Gemma 3 4B</text><text x="186.0" y="166.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">Ollama · open weights, local</text><text x="186.0" y="181.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">FAST copy (default) + photo reading</text><text x="186.0" y="196.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">temp 0.4 copy · 0.1 photos</text><text x="186.0" y="211.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">copy ≈ 14 s · whole kit ≈ 18 s</text><rect x="352" y="90" width="292" height="170" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="498.0" y="148.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Gemma 3 12B</text><text x="498.0" y="166.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">Ollama · open weights, local (8.2 GB)</text><text x="498.0" y="181.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">BEST-QUALITY copy, opt-in</text><text x="498.0" y="196.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">fewer flagged claims</text><text x="498.0" y="211.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">copy ≈ 53 s · whole kit ≈ 57 s</text><rect x="664" y="90" width="292" height="170" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="810.0" y="148.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">rembg · silueta (U2-Net)</text><text x="810.0" y="166.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">ONNX on CPU · 44 MB download</text><text x="810.0" y="181.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">removes the background</text><text x="810.0" y="196.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">mask on a ≤1400 px copy,</text><text x="810.0" y="211.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">applied to the full-res photo</text><rect x="976" y="90" width="292" height="170" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1122.0" y="148.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">OpenCV + NumPy + Pillow</text><text x="1122.0" y="166.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">classical, no learned weights except</text><text x="1122.0" y="181.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">FSRCNN ×2 super-resolution</text><text x="1122.0" y="196.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">NLMeans denoise · CLAHE · unsharp</text><text x="1122.0" y="211.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">backdrops · shadows · deck slides</text><rect x="1288" y="90" width="292" height="170" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1434.0" y="148.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">FFmpeg</text><text x="1434.0" y="166.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">deterministic video, not a model</text><text x="1434.0" y="181.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">camera moves, crossfades, text cards</text><text x="1434.0" y="196.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">H.264 yuv420p, ffprobe-validated</text><text x="1434.0" y="211.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">NOT generative video</text><rect x="20" y="310" width="1580" height="230" rx="12" fill="none" stroke="currentColor" stroke-opacity="0.28" stroke-dasharray="5 5"/><text x="34" y="332" font-size="11" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="0.55">BUILT AND MEASURED OFFLINE (THE APP&#x27;S DEFAULT PATH DOES NOT CALL THESE)</text><rect x="40" y="350" width="292" height="170" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="186.0" y="408.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Qwen3.5-397B-A17B</text><text x="186.0" y="426.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">teacher · hosted on Tinker</text><text x="186.0" y="441.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">writes whole kits, then revises</text><text x="186.0" y="456.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">using the checker&#x27;s findings</text><text x="186.0" y="471.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">(max 2 rounds)</text><rect x="352" y="350" width="292" height="170" rx="8" fill="#ea580c" fill-opacity="0.1" stroke="#ea580c" stroke-opacity="0.95"/><text x="498.0" y="408.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Qwen3.5-4B + LoRA (v2)</text><text x="498.0" y="426.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">student · rank 32 · 3 epochs</text><text x="498.0" y="441.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">trained on 319 chat examples</text><text x="498.0" y="456.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">88% clean kits (60 held-out)</text><text x="498.0" y="471.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">4.9 s per kit, hosted on Tinker</text><rect x="664" y="350" width="292" height="170" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="810.0" y="408.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Qwen3.5-4B (untuned)</text><text x="810.0" y="426.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">baseline, same prompt</text><text x="810.0" y="441.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">18% clean kits</text><text x="810.0" y="456.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">3.7 s per kit</text><text x="810.0" y="471.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">shows what training added</text><rect x="976" y="350" width="292" height="170" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1122.0" y="408.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Gemma 3 12B as judge</text><text x="1122.0" y="426.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">reads each kit next to its facts</text><text x="1122.0" y="441.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">lists unsupported statements</text><text x="1122.0" y="456.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">different family from the teacher</text><text x="1122.0" y="471.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">n = 30 kits per model</text><rect x="1288" y="350" width="292" height="170" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1434.0" y="408.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Deterministic checker</text><text x="1434.0" y="426.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">code, not a model</text><text x="1434.0" y="441.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">claims · invented numbers</text><text x="1434.0" y="456.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">(digits AND number words)</text><text x="1434.0" y="471.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">forbidden + regulated words</text><text x="20" y="575" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">Why two Gemma sizes: copy is the slowest step, so Fast (4B) is the default and Best quality (12B) is a switch on the Create page.</text><text x="20" y="597" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">The fine-tune runs on Tinker today, so using it sends facts to a cloud service. It is not wired into the app; exporting it to GGUF for Ollama is not done.</text><text x="20" y="619" font-size="12" font-weight="400" text-anchor="start" fill="#ea580c" fill-opacity="0.9">ElevenLabs voiceover is not built. Nothing in this diagram generates video frames: the video is image processing and FFmpeg.</text></svg>