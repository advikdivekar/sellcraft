ill-opacity="1.0">45%  (33–57)</text><text x="20" y="224" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1.0">Fine-tune v1</text><rect x="250" y="202" width="390.0" height="30" rx="5" fill="currentColor" fill-opacity="0.32"/><line x1="568.0" y1="217" x2="712.0" y2="217" stroke="currentColor" stroke-width="2"/><line x1="568.0" y1="210" x2="568.0" y2="224" stroke="currentColor" stroke-width="2"/><line x1="712.0" y1="210" x2="712.0" y2="224" stroke="currentColor" stroke-width="2"/><text x="726.0" y="222" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1.0">65%  (53–77)</text><text x="20" y="268" font-size="12" font-weight="600" text-anchor="start" fill="currentColor" fill-opacity="1.0">Fine-tune v2</text><rect x="250" y="246" width="528.0" height="30" rx="5" fill="#ea580c" fill-opacity="0.85"/><line x1="718.0" y1="261" x2="820.0" y2="261" stroke="#ea580c" stroke-width="2"/><line x1="718.0" y1="254" x2="718.0" y2="268" stroke="#ea580c" stroke-width="2"/><line x1="820.0" y1="254" x2="820.0" y2="268" stroke="#ea580c" stroke-width="2"/><text x="834.0" y="266" font-size="12" font-weight="700" text-anchor="start" fill="#ea580c" fill-opacity="1.0">88%  (78–95)</text><text x="20" y="360" font-size="13" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="1.0">B.  Independent judge: unsupported statements per kit (n = 30 per model, lower is better)</text><line x1="250.0" y1="384" x2="250.0" y2="600" stroke="currentColor" stroke-opacity="0.12"/><text x="250.0" y="616" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.6">0</text><line x1="332.5" y1="384" x2="332.5" y2="600" stroke="currentColor" stroke-opacity="0.12"/><text x="332.5" y="616" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.6">0.25</text><line x1="415.0" y1="384" x2="415.0" y2="600" stroke="currentColor" stroke-opacity="0.12"/><text x="415.0" y="616" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.6">0.5</text><line x1="497.5" y1="384" x2="497.5" y2="600" stroke="currentColor" stroke-opacity="0.12"/><text x="497.5" y="616" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.6">0.75</text><line x1="580.0" y1="384" x2="580.0" y2="600" stroke="currentColor" stroke-opacity="0.12"/><text x="580.0" y="616" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.6">1</text><text x="20" y="414" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1.0">Gemma 3 12B</text><rect x="250" y="392" width="42.9" height="28" rx="5" fill="currentColor" fill-opacity="0.32"/><line x1="259.9" y1="406" x2="339.1" y2="406" stroke="currentColor" stroke-width="2"/><text x="353.1" y="411" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1.0">0.13  (0.03–0.27)</text><text x="20" y="456" font-size="12" font-weight="600" text-anchor="start" fill="currentColor" fill-opacity="1.0">Fine-tune v2</text><rect x="250" y="434" width="66.0" height="28" rx="5" fill="#ea580c" fill-opacity="0.85"/><line x1="273.1" y1="448" x2="372.1" y2="448" stroke="#ea580c" stroke-width="2"/><text x="386.1" y="453" font-size="12" font-weight="700" text-anchor="start" fill="#ea580c" fill-opacity="1.0">0.20  (0.07–0.37)</text><text x="20" y="498" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1.0">Gemma 3 4B</text><rect x="250" y="476" width="66.0" height="28" rx="5" fill="currentColor" fill-opacity="0.32"/><line x1="273.1" y1="490" x2="372.1" y2="490" stroke="currentColor" stroke-width="2"/><text x="386.1" y="495" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1.0">0.20  (0.07–0.37)</text><text x="20" y="540" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1.0">Qwen3.5-4B, untuned</text><rect x="250" y="518" width="141.9" height="28" rx="5" fill="currentColor" fill-opacity="0.32"/><line x1="283.0" y1="532" x2="523.9" y2="532" stroke="currentColor" stroke-width="2"/><text x="537.9" y="537" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1.0">0.43  (0.10–0.83)</text><text x="20" y="582" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1.0">Fine-tune v1</text><rect x="250" y="560" width="207.9" height="28" rx="5" fill="currentColor" fill-opacity="0.32"/><line x1="316.0" y1="574" x2="636.0999999999999" y2="574" stroke="currentColor" stroke-width="2"/><text x="650.0999999999999" y="579" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1.0">0.63  (0.20–1.17)</text><rect x="1010" y="70" width="590" height="560" rx="12" fill="none" stroke="currentColor" stroke-opacity="0.28" stroke-dasharray="5 5"/><text x="1024" y="92" font-size="11" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="0.55">HOW TO READ THIS</text><text x="1034" y="112" font-size="12" font-weight="600" text-anchor="start" fill="currentColor" fill-opacity="0.9">The fine-tune clearly learned the rules it was trained on:</text><text x="1034" y="136" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">18% → 88% clean kits, far outside the intervals.</text><text x="1034" y="160" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9"></text><text x="1034" y="184" font-size="12" font-weight="600" text-anchor="start" fill="currentColor" fill-opacity="0.9">The independent judge is more modest: v2 halves the</text><text x="1034" y="208" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">untuned model&#x27;s flags (0.43 → 0.20) and is level with</text><text x="1034" y="232" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">Gemma 4B, but the intervals overlap, and Gemma 12B</text><text x="1034" y="256" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">is lower still. n = 30 cannot show more.</text><text x="1034" y="280" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9"></text><text x="1034" y="304" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">v1 was WORSE than its base on the judge (0.63): it had</text><text x="1034" y="328" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">learned the checker&#x27;s word list, not the idea. That is</text><text x="1034" y="352" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">why v2 trains only on kits the judge also passed.</text><text x="1034" y="376" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9"></text><text x="1034" y="400" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">The judge is Gemma, so it may be kind to Gemma&#x27;s own</text><text x="1034" y="424" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">writing. That bias favours the Gemma rows, i.e. it works</text><text x="1034" y="448" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">against the fine-tune&#x27;s claim.</text><text x="1034" y="472" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9"></text><text x="1034" y="496" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">Synthetic products only. No real-seller test yet.</text><text x="20" y="660" font-size="11" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.8">Source: docs/RESULTS.md, regenerated with `python -m finetune.rescore` and `python -m finetune.judge`. Clean kit = no unsupported claim, invented number, forbidden word, placeholder or invalid JSON.</text><text x="20" y="682" font-size="11" font-weight="400" text-anchor="start" fill="#ea580c" fill-opacity="0.8">Caveat: the checker also filtered the training data, so rule-following is partly &#x27;trained against&#x27;. The judge is the independent check.</text></svg><figcaption>Clean-kit rates with intervals for five models, and the independent judge&#x27;s flags. The fine-tune clearly learned the rules; the judge shows a smaller gain.</figcaption></figure><figure><h2>12. Observability and privacy</h2><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 800" role="img" aria-label="Each model call is a traced span, each flagged claim is an issue, and an allow-list scrubber plus a canary test keep seller text out of Sentry" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" style="max-width:100%;height:auto"><title>Observability and privacy</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" fill-opacity="0.75"/></marker><marker id="arr-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="currentColor" fill-opacity="0.75"/></marker><marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="arr-a-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#ea580c"/></marker></defs><rect x="20" y="50" width="520" height="420" rx="12" fill="none" stroke="#ea580c" stroke-opacity="0.9" stroke-dasharray="5 5"/><text x="34" y="72" font-size="11" font-weight="700" text-anchor="start" fill="#ea580c" fill-opacity="1">TRACE OF ONE KIT (SENTRY TRANSACTION)</text><rect x="40" y="90" width="480" height="50" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="280.0" y="118.0" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">generation  (job_id, platforms)</text><rect x="70" y="156" width="450" height="62" rx="8" fill="#ea580c" fill-opacity="0.1" stroke="#ea580c" stroke-opacity="0.95"/><text x="295.0" y="182.5" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">gen_ai.invoke_agent · sellcraft-copy</text><text x="295.0" y="200.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">model · job_id · prompt_version · flags.total / forbidden / risky / regulated</text><rect x="100" y="232" width="420" height="62" rx="8" fill="#ea580c" fill-opacity="0.1" stroke="#ea580c" stroke-opacity="0.95"/><text x="310.0" y="258.5" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">gen_ai.chat × (4 + N)   one per model call</text><text x="310.0" y="276.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">model · input/output tokens · tokens per second · latency_ms</text><rect x="70" y="310" width="450" height="40" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="295.0" y="333.0" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">video.clip   ·   deck.build   ·   video.assemble</text><text x="40" y="384" font-size="11" font-weight="400" text-anchor="start" fill="#ea580c" fill-opacity="0.85">Prompt and reply are NEVER attached: they hold the seller&#x27;s facts.</text><text x="40" y="404" font-size="11" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.75">SENTRY_DSN empty → every call is a no-op.</text><rect x="580" y="50" width="480" height="420" rx="12" fill="none" stroke="currentColor" stroke-opacity="0.28" stroke-dasharray="5 5"/><text x="594" y="72" font-size="11" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="0.55">EVENTS (ISSUES)</text><rect x="600" y="90" width="440" height="100" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="820.0" y="121.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Flagged claim, one issue per rule</text><text x="820.0" y="139.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">tags: flag.kind (forbidden · risky · regulated),</text><text x="820.0" y="154.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">flag.term, model, prompt_version</text><text x="820.0" y="169.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">→ a regression after a model swap shows up as a chart</text><rect x="600" y="210" width="440" height="100" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="820.0" y="241.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Seller report</text><text x="820.0" y="259.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">&#x27;The copy still made something up&#x27;</text><text x="820.0" y="274.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">section + a fixed reason code, job_id</text><text x="820.0" y="289.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">no free text (it could carry facts)</text><rect x="600" y="330" width="440" height="110" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="820.0" y="366.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">What a trace answers</text><text x="820.0" y="384.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">which stage was slowest (copy vs video)</text><text x="820.0" y="399.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">tokens per second for each model</text><text x="820.0" y="414.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">which model + prompt version raised a flag</text><rect x="1100" y="50" width="500" height="420" rx="12" fill="none" stroke="#ea580c" stroke-opacity="0.9" stroke-dasharray="5 5"/><text x="1114" y="72" font-size="11" font-weight="700" text-anchor="start" fill="#ea580c" fill-opacity="1">PRIVACY: ALLOW-LIST SCRUBBER (BEFORE SEND)</text><rect x="1120" y="90" width="460" height="80" rx="8" fill="#ea580c" fill-opacity="0.1" stroke="#ea580c" stroke-opacity="0.95"/><text x="1350.0" y="118.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Removed</text><text x="1350.0" y="136.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">request, user, extras, breadcrumbs, local variables,</text><text x="1350.0" y="151.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">any span data or tag not on the allow-list</text><rect x="1120" y="190" width="460" height="80" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1350.0" y="218.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Exception text</text><text x="1350.0" y="236.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">blank unless it is our own AppError</text><text x="1350.0" y="251.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">(pydantic messages can echo submitted values)</text><rect x="1120" y="290" width="460" height="150" rx="8" fill="#ea580c" fill-opacity="0.1" stroke="#ea580c" stroke-opacity="0.95"/><text x="1350.0" y="338.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Canary test (tests/test_tracing.py)</text><text x="1350.0" y="356.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">pushes a unique marker through the facts and the</text><text x="1350.0" y="371.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">model output; fails if it appears in ANY envelope</text><text x="1350.0" y="386.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">the SDK would send. Also checks that the</text><text x="1350.0" y="401.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">useful metadata does get through.</text><polyline points="540,195 580,195" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><text x="560.0" y="187.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.85" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">events</text><polyline points="1060,250 1100,250" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><text x="1080.0" y="242.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.85" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">scrub</text><rect x="20" y="520" width="520" height="90" rx="8" fill="currentColor" fill-opacity="0.02" stroke="currentColor" stroke-opacity="0.55" stroke-dasharray="4 4"/><text x="280.0" y="553.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="0.55">Sentry (cloud, optional)</text><text x="280.0" y="571.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">receives scrubbed metadata only</text><text x="280.0" y="586.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">traces, flag issues, reports</text><polyline points="1340,470 1340,495 280,495 280,520" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/><text x="810.0" y="487.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.85" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">only what passed the scrubber</text><text x="20" y="660" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">Why this matters for a seller tool: the product facts are the seller&#x27;s data. Tracing tells us how the pipeline behaves without ever reading what was sold.</text><text x="20" y="684" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">Every event carries the prompt version, so a prompt edit and a model swap can be told apart.</text><text x="20" y="708" font-size="11" font-weight="400" text-anchor="start" fill="#ea580c" fill-opacity="0.8">Not claimed: that Sentry has caught a production incident. The setup is real and tested; real traces still need screenshots from a running session.</text></svg><figcaption>Traced model calls, flagged-claim issues, and the scrubber and canary test that keep seller text out of Sentry.</figcaption></figure><figure><h2>13. Data model, API and job states</h2><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 860" role="img" aria-label="The three SQLite tables, the HTTP routes grouped by purpose, and the job state machine" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" style="max-width:100%;height:auto"><title>Data model and API</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" fill-opacity="0.75"/></marker><marker id="arr-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="currentColor" fill-opacity="0.75"/></marker><marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="arr-a-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#ea580c"/></marker></defs><rect x="20" y="50" width="470" height="560" rx="12" fill="none" stroke="currentColor" stroke-opacity="0.28" stroke-dasharray="5 5"/><text x="34" y="72" font-size="11" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="0.55">SQLITE (DATA/SELLCRAFT.DB)</text><rect x="40" y="90" width="430" height="150" rx="8" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-opacity="0.55"/><line x1="40" y1="106" x2="470" y2="106" stroke="currentColor" stroke-opacity="0.3"/><text x="255.0" y="102" font-size="11" font-weight="700" text-anchor="middle" fill="currentColor" fill-opacity="0.8">jobs</text><text x="255.0" y="126" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">id · status · created_at · updated_at</text><text x="255.0" y="141" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">product (JSON) · settings (JSON)</text><text x="255.0" y="156" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">copy_output (JSON) · copy_source</text><text x="255.0" y " y="90" width="410" height="46" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1365.0" y="116.0" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">queued</text><rect x="1160" y="170" width="410" height="46" rx="8" fill="#ea580c" fill-opacity="0.1" stroke="#ea580c" stroke-opacity="0.95"/><text x="1365.0" y="196.0" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">generating_copy + generating_video (together)</text><rect x="1160" y="250" width="410" height="46" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1365.0" y="276.0" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">deck (inside the video stage)</text><rect x="1160" y="330" width="410" height="46" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1365.0" y="356.0" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">assembling_video</text><rect x="1160" y="410" width="410" height="46" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1365.0" y="436.0" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">completed</text><polyline points="1365,136 1365,170" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><polyline points="1365,216 1365,250" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><polyline points="1365,296 1365,330" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><polyline points="1365,376 1365,410" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><rect x="1160" y="490" width="190" height="46" rx="8" fill="currentColor" fill-opacity="0.02" stroke="currentColor" stroke-opacity="0.55" stroke-dasharray="4 4"/><text x="1255.0" y="516.0" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="0.55">failed</text><text x="1366" y="506" font-size="11" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.8">retryable → &#x27;Try again&#x27;</text><text x="1366" y="524" font-size="11" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.8">skips a copy that already finished</text><polyline points="1580,300 1590,300 1590,513 1350,513" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/><text x="20" y="664" font-size="13" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="1.0">Design choices</text><text x="20" y="690" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">•  Everything is a polling job: the UI asks for the job every 1.5 s, and the server computes overall progress from the real state of each stage, never from a timer.</text><text x="20" y="714" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">•  Stages are independent functions, so they can move to a worker later; today they run in a background thread, which means a restart loses an in-flight job.</text><text x="20" y="738" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">•  Files are named by UUID and served only through their job&#x27;s route, so one job cannot read another&#x27;s assets. Uploads are checked by their bytes, not their extension.</text><text x="20" y="762" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">•  The Shopify token lives only on the backend, encrypted at rest, and is never sent to the browser. Publishing creates a draft; going live is a separate step in Shopify.</text><text x="20" y="786" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">•  There are no user accounts: connections belong to the installation, so it is meant for one seller, behind the access code when shared.</text></svg><figcaption>The tables, the routes by purpose and the job state machine, with the design choices behind them.</figcaption></figure><figure><h2>14. Deployment modes and the frontend</h2><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 760" role="img" aria-label="The same app runs locally, can be opened on a phone through a tunnel with an access code, and a landing-only build can be deployed publicly with no backend" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" style="max-width:100%;height:auto"><title>Deployment modes and frontend</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" fill-opacity="0.75"/></marker><marker id="arr-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="currentColor" fill-opacity="0.75"/></marker><marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="arr-a-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#ea580c"/></marker></defs><rect x="20" y="50" width="500" height="500" rx="12" fill="none" stroke="#ea580c" stroke-opacity="0.9" stroke-dasharray="5 5"/><text x="34" y="72" font-size="11" font-weight="700" text-anchor="start" fill="#ea580c" fill-opacity="1">A  FULL APP ON YOUR MACHINE</text><rect x="50" y="90" width="440" height="66" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-o n leave</h2><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 800" role="img" aria-label="What stays on the seller&#x27;s machine and exactly what can leave it, to which service, and only when" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" style="max-width:100%;height:auto"><title>Trust boundary</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" fill-opacity="0.75"/></marker><marker id="arr-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="currentColor" fill-opacity="0.75"/></marker><marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="arr-a-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#ea580c"/></marker></defs><rect x="20" y="50" width="1000" height="650" rx="12" fill="none" stroke="#ea580c" stroke-opacity="0.9" stroke-dasharray="5 5"/><text x="34" y="72" font-size="11" font-weight="700" text-anchor="start" fill="#ea580c" fill-opacity="1">YOUR MACHINE: SELLER DATA STAYS HERE</text><rect x="60" y="100" width="240" height="90" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="180.0" y="141.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Browser / phone</text><text x="180.0" y="159.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">photos, facts, edits</text><rect x="330" y="100" width="240" height="90" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="450.0" y="141.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Next.js</text><text x="450.0" y="159.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">UI + proxy</text><rect x="600" y="100" width="240" height="90" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="720.0" y="141.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">FastAPI</text><text x="720.0" y="159.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">jobs · checks</text><rect x="600" y="250" width="240" height="90" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="720.0" y="291.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Ollama</text><text x="720.0" y="309.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">Gemma reads + writes</text><rect x="330" y="250" width="240" height="90" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="450.0" y="291.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Image + video work</text><text x="450.0" y="309.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">rembg · OpenCV · FFmpeg</text><rect x="60" y="250" width="240" height="90" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="180.0" y="291.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">SQLite + disk</text><text x="180.0" y="309.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">facts, photos, outputs</text><rect x="330" y="400" width="240" height="90" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="450.0" y="433.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Vault</text><text x="450.0" y="451.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">Shopify token, encrypted</text><text x="450.0" y="466.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">used only for the draft</text><rect x="600" y="400" width="240" height="90" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="720.0" y="441.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Allow-list scrubber</text><text x="720.0" y="459.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">metadata only leaves</text><polyline points="300,145 330,145" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><polyline points="570,145 600,145" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><polyline points="720,190 720,250" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><polyline points="600,295 570,295" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><polyline points="330,295 300,295" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><text x="60" y="560" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">Photos, product facts and generated copy are processed by local open models.</text><text x="60" y="584" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">Nothing is posted anywhere unless the seller taps a button.</text><text x="60" y="608" font-size="12" font-weight="400" text-anchor="start" fill="#ea580c" fill-opacity="0.9">The fine-tune (hosted on Tinker) is NOT in this path: using it would send facts out.</text><text x="60" y="640" font-size="11" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.8">Caveat: a Cloudflare tunnel passes traffic through Cloudflare, so use it for demos, with the access code, not for sensitive photos.</text><rect x="1080" y="50" width="520" height="650" rx="12" fill="none" stroke="currentColor" stroke-opacity="0.28" stroke-dasharray="5 5"/><text x="1094" y="72" font-size="11" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="0.55">OUTSIDE, AND EXACTLY WHAT CROSSES</text><rect x="1110" y="90" width="460" height="86" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1340.0" y="121.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Shopify</text><text x="1340.0" y="139.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">on tap only: draft product with title,</text><text x="1340.0" y="154.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">copy, photos, video. Token from the vault.</text><rect x="1110" y="200" width="460" height="86" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1340.0" y="231.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Sentry (optional)</text><text x="1340.0" y="249.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">scrubbed metadata: model, tokens,</text><text x="1340.0" y="264.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">latency, flag rule + word. Never text.</text><rect x="1110" y="310" width="460" height="86" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1340.0" y="341.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Tinker (offline)</text><text x="1340.0" y="359.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">synthetic training data and eval kits.</text><text x="1340.0" y="374.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">No real seller data was ever sent.</text><rect x="1110" y="420" width="460" height="86" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1340.0" y="451.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">GitHub (public repo)</text><text x="1340.0" y="469.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">code, docs, screenshots. No seller data,</text><text x="1340.0" y="484.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">no keys (scanned before going public).</text><rect x="1110" y="530" width="460" height="86" rx="8" fill="currentColor" fill-opacity="0.02" stroke="currentColor" stroke-opacity="0.55" stroke-dasharray="4 4"/><text x="1340.0" y="569.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="0.55">ElevenLabs</text><text x="1340.0" y="587.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">voiceover is not built: nothing is sent.</text><polyline points="840,430 1060,430 1060,243 1110,243" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/><text x="950.0" y="422.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.85" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">metadata</text><polyline points="840,140 1060,140 1060,133 1110,133" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/><text x="950.0" y="132.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.85" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">on tap</text><text x="20" y="740" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">Open-model benefit, concretely: with Gemma through Ollama, the seller&#x27;s product data never needs to leave their computer to get a full kit, and there is no per-kit fee.</text><text x="20" y="764" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">Where closed would be better: a frontier API would probably write nicer prose with no training, at the cost of sending every product&#x27;s facts to a third party.</text></svg><figcaption>Seller data stays on the machine. The only things that can leave are on-tap Shopify drafts and scrubbed Sentry metadata.</figcaption></figure></main></body></html>
