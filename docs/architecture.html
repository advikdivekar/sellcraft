<h1>SellCraft AI: how it works</h1><p class="lede">One product photo and a few facts become refined photos, an image deck, a 10-second video and platform copy. Open models run on the seller's own machine.</p>

<rect x="616" y="50" width="650" height="930" rx="12" fill="none" stroke="currentColor" stroke-opacity="0.28" stroke-dasharray="5 5"/><text x="630" y="72" font-size="11" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="0.55">FASTAPI BACKEND (PYTHON)</text><rect x="640" y="90" width="190" height="100" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="735.0" y="121.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">API routes</text><text x="735.0" y="139.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">uploads · analyze · generations</text><text x="735.0" y="154.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">copy · reassemble · kit.zip</text><text x="735.0" y="169.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">publish · connections</text><rect x="860" y="90" width="190" height="100" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="955.0" y="121.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Job orchestrator</text><text x="955.0" y="139.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">background thread</text><text x="955.0" y="154.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">stage state machine</text><text x="955.0" y="169.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">real progress % per stage</text><rect x="1080" y="90" width="170" height="100" rx="8" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-opacity="0.55"/><line x1="1080" y1="106" x2="1250" y2="106" stroke="currentColor" stroke-opacity="0.3"/><text x="1165.0" y="102" font-size="11" font-weight="700" text-anchor="middle" fill="currentColor" fill-opacity="0.8">Vault</text><text x="1165.0" y="126" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">Shopify token</text><text x="1165.0" y="141" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">Fernet-encrypted at rest</text><rect x="640" y="230" width="190" height="70" rx="8" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-opacity="0.55"/><line x1="640" y1="246" x2="830" y2="246" stroke="currentColor" stroke-opacity="0.3"/><text x="735.0" y="242" font-size="11" font-weight="700" text-anchor="middle" fill="currentColor" fill-opacity="0.8">SQLite</text><text x="735.0" y="266" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">jobs · assets · connections</text><rect x="1060" y="230" width="190" height="70" rx="8" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-opacity="0.55"/><line x1="1060" y1="246" x2="1250" y2="246" stroke="currentColor" stroke-opacity="0.3"/><text x="1155.0" y="242" font-size="11" font-weight="700" text-anchor="middle" fill="currentColor" fill-opacity="0.8">Disk</text><text x="1155.0" y="266" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">uploads/ · outputs/ (UUID names)</text><polyline points="550,355 590,355 590,140 640,140" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><text x="556" y="376" font-size="11" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.85" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">photos, facts,</text><text x="556" y="391" font-size="11" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.85" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">edits (JSON)</text><polyline points="830,140 860,140" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><polyline points="890,190 890,265 830,265" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><text x="898.0" y="213.5" font-size="11" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.85" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">state · partial copy</text><polyline points="1020,190 1020,265 1060,265" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><text x="1028.0" y="213.5" font-size="11" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.85" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">files</text><rect x="640" y="340" width="290" height="470" rx="12" fill="none" stroke="#ea580c" stroke-opacity="0.9" stroke-dasharray="5 5"/><text x="654" y="362" font-size="11" font-weight="700" text-anchor="start" fill="#ea580c" fill-opacity="1">VISUAL LANE</text><rect x="960" y="340" width="290" height="470" rx="12" fill="none" stroke="#ea580c" stroke-opacity="0.9" stroke-dasharray="5 5"/><text x="974" y="362" font-size="11" font-weight="700" text-anchor="start" fill="#ea580c" fill-opacity="1">LANGUAGE LANE</text><polyline points="955,190 955,322 785,322 785,372" fill="none" stroke="#ea580c" stroke-opacity="1" stroke-width="2" marker-end="url(#arr-a)"/><polyline points="955,322 1105,322 1105,372" fill="none" stroke="#ea580c" stroke-opacity="1" stroke-width="2" marker-end="url(#arr-a)"/><text x="952.0" y="314.0" font-size="11" font-weight="400" text-anchor="middle" fill="#ea580c" fill-opacity="1" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">starts BOTH at once</text><rect x="655" y="372" width="260" height="58" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="785.0" y="396.5" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">1  Measure each photo</text><text x="785.0" y="414.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">NumPy: sharpness · brightness · colour</text><rect x="655" y="450" width="260" height="58" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="785.0" y="474.5" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">2  Cut out the product</text><text x="785.0" y="492.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">rembg (U2-Net) at full resolution</text><polyline points="785,430 785,450" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><rect x="655" y="528" width="260" height="58" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="785.0" y="552.5" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">3  Refine the product itself</text><text x="785.0" y="570.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">OpenCV: denoise · 2× super-res · contrast</text><polyline points="785,508 785,528" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><rect x="655" y="606" width="260" height="58" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="785.0" y="630.5" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">4  Backdrop from photo stats</text><text x="785.0" y="648.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">Pillow: shadow · reflection · light sweep</text><polyline points="785,586 785,606" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><rect x="655" y="684" width="260" height="58" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="785.0" y="708.5" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">5  Render 4–6 shots</text><text x="785.0" y="726.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">FFmpeg: camera moves + crossfades</text><polyline points="785,664 785,684" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><rect x="975" y="372" width="260" height="58" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1105.0" y="396.5" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">1  Build prompts</text><text x="1105.0" y="414.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">facts · tone · platform · goal</text><rect x="975" y="450" width="260" height="58" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1105.0" y="474.5" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">2  Split kit into 5–6 parts</text><text x="1105.0" y="492.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">listing · social · video · per platform</text><polyline points="1105,430 1105,450" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><rect x="975" y="528" width="260" height="58" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1105.0" y="552.5" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">3  Parallel LLM calls</text><text x="1105.0" y="570.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">Ollama, OLLAMA_NUM_PARALLEL=4</text><polyline points="1105,508 1105,528" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><rect x="975" y="606" width="260" height="58" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1105.0" y="630.5" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">4  Safety post-check</text><text x="1105.0" y="648.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">risky claims · forbidden words · placeholders</text><polyline points="1105,586 1105,606" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><rect x="975" y="684" width="260" height="58" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1105.0" y="708.5" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">5  Publish parts as they finish</text><text x="1105.0" y="726.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">UI shows copy at ~20 s</text><polyline points="1105,664 1105,684" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><polyline points="785,802 785,836" fill="none" stroke="#ea580c" stroke-opacity="1" stroke-width="2" marker-end="url(#arr-a)"/><polyline points="1105,802 1105,836" fill="none" stroke="#ea580c" stroke-opacity="1" stroke-width="2" marker-end="url(#arr-a)"/><rect x="655" y="838" width="580" height="84" rx="8" fill="#ea580c" fill-opacity="0.1" stroke="#ea580c" stroke-opacity="0.95"/><text x="945.0" y="868.0" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Image deck (Pillow), then final video (FFmpeg)</text><text x="945.0" y="886.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">deck: hero · benefits · close-up · angles · CTA, laid out from the finished copy</text><text x="945.0" y="901.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">video: motion clip + text cards, ffprobe-checked ≈ 10 s, H.264 yuv420p (plays on iPhone)</text><text x="945" y="950" font-size="11" font-weight="400" text-anchor="middle" fill="#ea580c" fill-opacity="0.9">The two lanes only meet here. A copy edit re-runs just this box, not the lanes.</text><rect x="1316" y="440" width="224" height="200" rx="12" fill="none" stroke="currentColor" stroke-opacity="0.28" stroke-dasharray="5 5"/><text x="1330" y="462" font-size="11" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="0.55">LOCAL MODEL SERVER</text><rect x="1336" y="480" width="184" height="130" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1428.0" y="526.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Ollama</text><text x="1428.0" y="544.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">Gemma 3 12B writes copy</text><text x="1428.0" y="559.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">Gemma 3 4B reads photos</text><text x="1428.0" y="574.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">(set at start-up)</text><polyline points="1235,545 1336,545" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><text x="1271.5" y="562.0" font-size="11" font-weight="400" text-anchor="end" fill="currentColor" fill-opacity="0.85" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">5–6 JSON calls</text><rect x="1316" y="680" width="224" height="300" rx="12" fill="none" stroke="currentColor" stroke-opacity="0.28" stroke-dasharray="5 5"/><text x="1330" y="702" font-size="11" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="0.55">OUTSIDE (OPTIONAL)</text><rect x="1336" y="720" width="184" height="90" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1428.0" y="753.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Shopify Admin API</text><text x="1428.0" y="771.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">creates a DRAFT product</text><text x="1428.0" y="786.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">photos + video + copy</text><rect x="1336" y="830" width="184" height="60" rx="8" fill="currentColor" fill-opacity="0.02" stroke="currentColor" stroke-opacity="0.55" stroke-dasharray="4 4"/><text x="1428.0" y="856.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="0.55">ElevenLabs</text><text x="1428.0" y="874.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">voiceover (not built yet)</text><rect x="1336" y="905" width="184" height="60" rx="8" fill="currentColor" fill-opacity="0.02" stroke="currentColor" stroke-opacity="0.55" stroke-dasharray="4 4"/><text x="1428.0" y="931.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="0.55">Sentry</text><text x="1428.0" y="949.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">stage traces (not wired)</text><polyline points="1250,140 1290,140 1290,765 1336,765" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/><text x="1298" y="404" font-size="11" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">publish draft</text><text x="1298" y="419" font-size="11" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.7" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">(token from the vault)</text></svg><figcaption>Every component and what moves between them. The orange parts are the mechanism worth understanding: the two lanes start together and only meet at the deck and final video.</figcaption></figure><figure><h2>2. Why the wait is shorter</h2><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 560" role="img" aria-label="Copy and video are produced at the same time and meet at the deck and final video, so the wait is the slower lane plus a few seconds, not the sum" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" style="max-width:100%;height:auto"><title>Pipeline timing</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" fill-opacity="0.75"/></marker><marker id="arr-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="currentColor" fill-opacity="0.75"/></marker><marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="arr-a-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#ea580c"/></marker></defs><line x1="230.0" y1="54" x2="230.0" y2="290" stroke="currentColor" stroke-opacity="0.12"/><text x="230.0" y="40" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.6">0 s</text><line x1="410.0" y1="54" x2="410.0" y2="290" stroke="currentColor" stroke-opacity="0.12"/><text x="410.0" y="40" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.6">10 s</text><line x1="590.0" y1="54" x2="590.0" y2="290" stroke="currentColor" stroke-opacity="0.12"/><text x="590.0" y="40" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.6">20 s</text><line x1="770.0" y1="54" x2="770.0" y2="290" stroke="currentColor" stroke-opacity="0.12"/><text x="770.0" y="40" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.6">30 s</text><line x1="950.0" y1="54" x2="950.0" y2="290" stroke="currentColor" stroke-opacity="0.12"/><text x="950.0" y="40" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.6">40 s</text><line x1="1130.0" y1="54" x2="1130.0" y2="290" stroke="currentColor" stroke-opacity="0.12"/><text x="1130.0" y="40" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.6">50 s</text><line x1="1310.0" y1="54" x2="1310.0" y2="290" stroke="currentColor" stroke-opacity="0.12"/><text x="1310.0" y="40" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.6">60 s</text><line x1="1490.0" y1="54" x2="1490.0" y2="290" stroke="currentColor" stroke-opacity="0.12"/><text x="1490.0" y="40" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.6">70 s</text><text x="20" y="40" font-size="11" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="0.6">Time since you tap Generate</text><text x="20" y="92" font-size="12" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="1.0">SEQUENTIAL</text><text x="20" y="110" font-size="11" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.65">what the first version did</text><rect x="230.0" y="70" width="810.0" height="40" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="635.0" y="93.0" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Write copy (Gemma 12B)</text><rect x="1040.0" y="70" width="288.0" height="40" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1184.0" y="93.0" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Build video</text><text x="1342.0" y="95" font-size="13" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="0.9">≈ 65 s</text><text x="20" y="202" font-size="12" font-weight="700" text-anchor="start" fill="#ea580c" fill-opacity="1.0">OVERLAPPED</text><text x="20" y="220" font-size="11" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.65">what runs now</text><text x="220.0" y="174" font-size="11" font-weight="400" text-anchor="end" fill="currentColor" fill-opacity="0.75">language lane</text><text x="220.0" y="246" font-size="11" font-weight="400" text-anchor="end" fill="currentColor" fill-opacity="0.75">visual lane</text><rect x="230.0" y="150" width="810.0" height="40" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="635.0" y="173.0" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Write copy: 5–6 parts in parallel</text><circle cx="590.0" cy="190" r="4" fill="#ea580c"/><circle cx="824.0" cy="190" r="4" fill="#ea580c"/><text x="590.0" y="210" font-size="11" font-weight="400" text-anchor="middle" fill="#ea580c" fill-opacity="1.0" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">first parts appear in the editor (read-only)</text><rect x="230.0" y="226" width="288.0" height="40" rx="8" fill="#ea580c" fill-opacity="0.1" stroke="#ea580c" stroke-opacity="0.95"/><text x="374.0" y="249.0" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Refine photos + render shots</text><line x1="524.0" y1="246" x2="1036.0" y2="246" stroke="currentColor" stroke-opacity="0.4" stroke-dasharray="3 4"/><text x="788.0" y="238" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.7" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">video ready at 16 s, waits for the copy</text><rect x="1040.0" y="150" width="72.0" height="116" rx="8" fill="#ea580c" fill-opacity="0.1" stroke="#ea580c" stroke-opacity="0.95"/><text x="1076.0" y="211.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1"></text><text x="1076.0" y="204" font-size="11" font-weight="700" text-anchor="middle" fill="#ea580c" fill-opacity="1.0">deck</text><text x="1076.0" y="219" font-size="11" font-weight="400" text-anchor="middle" fill="#ea580c" fill-opacity="1.0">+ text</text><text x="1126.0" y="214" font-size="13" font-weight="700" text-anchor="start" fill="#ea580c" fill-opacity="1.0">≈ 49 s</text><text x="1126.0" y="232" font-size="11" font-weight="400" text-anchor="start" fill="#ea580c" fill-opacity="1.0">copy visible from ~20 s</text><text x="20" y="330" font-size="12" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="1.0">Where the saving comes from (measured on an 18 GB Mac)</text><text x="20" y="354" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.88">•  Video needs only the photos, never the copy, so it starts at t = 0 instead of waiting.</text><text x="20" y="376" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.88">•  Ollama serves requests together (OLLAMA_NUM_PARALLEL=4). Decoding is memory-bound, so 3 parallel calls took 19 s instead of 37 s.</text><text x="20" y="398" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.88">•  Each parallel call re-reads its prompt, so every part gets only the sections it needs: 6 parts went from 63 s to 46 s.</text><text x="20" y="420" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.88">•  A leftover [placeholder] is stripped in place and only parts that really failed are re-run, so there is no second full round.</text><text x="20" y="462" font-size="12" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="1.0">Job states (stored in SQLite, polled by the UI)</text><rect x="20" y="478" width="68.0" height="30" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="54.0" y="495.5" font-size="11" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">queued</text><rect x="140" y="478" width="131.0" height="30" rx="8" fill="#ea580c" fill-opacity="0.1" stroke="#ea580c" stroke-opacity="0.95"/><text x="205.5" y="495.5" font-size="11" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">generating_copy</text><rect x="320" y="478" width="138.0" height="30" rx="8" fill="#ea580c" fill-opacity="0.1" stroke="#ea580c" stroke-opacity="0.95"/><text x="389.0" y="495.5" font-size="11" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">generating_video</text><rect x="520" y="478" width="54.0" height="30" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="547.0" y="495.5" font-size="11" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">deck</text><rect x="600" y="478" width="138.0" height="30" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="669.0" y="495.5" font-size="11" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">assembling_video</text><rect x="800" y="478" width="89.0" height="30" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="844.5" y="495.5" font-size="11" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">completed</text><polyline points="88.0,493 140,493" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><polyline points="271.0,493 320,493" fill="none" stroke="#ea580c" stroke-opacity="1" stroke-width="2" marker-end="url(#arr-a)"/><text x="295.5" y="484.0" font-size="11" font-weight="400" text-anchor="middle" fill="#ea580c" fill-opacity="1" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">run together</text><polyline points="458.0,493 520,493" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><polyline points="574.0,493 600,493" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><polyline points="738.0,493 800,493" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><rect x="960" y="478" width="70" height="30" rx="8" fill="currentColor" fill-opacity="0.02" stroke="currentColor" stroke-opacity="0.55" stroke-dasharray="4 4"/><text x="995.0" y="495.5" font-size="11" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="0.55">failed</text><text x="1046" y="498" font-size="11" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.8">a failed video keeps the copy; Try again skips the copy step</text></svg><figcaption>Timing of one kit with Gemma 12B and one or two photos (typical, measured on an 18 GB Mac). Copy and video overlap, so the wait is the slower lane plus a few seconds.</figcaption></figure><figure><h2>3. The fine-tuning experiment</h2><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 700" role="img" aria-label="A strong teacher writes copy, a code checker rejects anything that breaks the rules, and only clean kits train a small student that is then tested against the Gemma baselines on held-out products" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica,
