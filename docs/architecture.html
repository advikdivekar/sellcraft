<h1>Mochi: how it works</h1><p class="lede">One product photo and a few facts become refined photos, an image deck, a 10-second video and platform copy. Open models run on the seller's own machine.</p>

or" fill-opacity="0.72">polls the job every 1.5 s</text><rect x="40" y="210" width="210" height="70" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="145.0" y="241.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Browser storage</text><text x="145.0" y="259.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">draft autosave (text only)</text><rect x="40" y="300" width="210" height="70" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="145.0" y="331.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Camera + share sheet</text><text x="145.0" y="349.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">take photos · share video + deck</text><rect x="40" y="390" width="210" height="70" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="145.0" y="421.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Edits copy in place</text><text x="145.0" y="439.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">saved on blur → PATCH /copy</text><rect x="320" y="50" width="250" height="460" rx="12" fill="none" stroke="currentColor" stroke-opacity="0.28" stroke-dasharray="5 5"/><text x="334" y="72" font-size="11" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="0.55">EDGE ON YOUR OWN MACHINE</text><rect x="340" y="90" width="210" height="80" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="445.0" y="118.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Cloudflare quick tunnel</text><text x="445.0" y="136.5" font-size="11" font-weight="400" text-anchor="middle roke-opacity="0.55"/><line x1="1080" y1="106" x2="1250" y2="106" stroke="currentColor" stroke-opacity="0.3"/><text x="1165.0" y="102" font-size="11" font-weight="700" text-anchor="middle" fill="currentColor" fill-opacity="0.8">Vault</text><text x="1165.0" y="126" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">Shopify token</text><text x="1165.0" y="141" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">Fernet-encrypted at rest</text><rect x="640" y="230" width="190" height="70" rx="8" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-opacity="0.55"/><line x1="640" y1="246" x2="830" y2="246" stroke="currentColor" stroke-opacity="0.3"/><text x="735.0" y="242" font-size="11" font-weight="700" text-anchor="middle" fill="currentColor" fill-opacity="0.8">SQLite</text><text x="735.0" y="266" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">jobs · assets · connections</text><rect x="1060" y="230" width="190" height="70" rx="8" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-opacity="0.55"/><line x1="1060" y1="246" x2="1250" y2="246" stroke="currentColor" stroke-opacity="0.3"/><text x="1155.0" y="242" font-size="11" font-weight="700" text-anchor="middle" fill="currentColor" fill-opacity="0.8">Disk</text><text x="1155.0" y="266" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">uploads/ · outputs/ (UUID names)</text><polyline points="550,355 590,355 590,140 640,140" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><text x="556" y="376" font-size="11" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.85" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">photos, facts,</text><text x="556" y="391" font-size="11" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.85" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">edits (JSON)</text><polyline points="830,140 860,140" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><polyline points="890,190 890,265 830,265" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><text x="898.0" y="213.5" font-size="11" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.85" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">state · partial copy</text><polyline points="1020,190 1020,265 1060,265" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><text x="1028.0" y="213.5" font-size="11" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.85" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">files</text><rect x="640" y="340" width="290" height="470" rx="12" fill="none" stroke="#ea580c" stroke-opacity="0.9" stroke-dasharray="5 5"/><text x="654" y="362" font-size="11" font-weight="700" text-anchor="start" fill="#ea580c" fill-opacity="1">VISUAL LANE</text><rect x="960" y="340" width="290" height="470" rx="12" fill="none" stroke="#ea580c" stroke-opacity="0.9" stroke-dasharray="5 5"/><text x="974" y="362" font-size="11" font-weight="700" text-anchor="start" fill="#ea580c" fill-opacity="1">LANGUAGE LANE</text><polyline points="955,190 955,322 785,322 785,372" fill="none" stroke="#ea580c" stroke-opacity="1" stroke-width="2" marker-end="url(#arr-a)"/><polyline points="955,322 1105,322 1105,372" fill="none" stroke="#ea580c" stroke-opacity="1" stroke-width="2" marker-end="url(#arr-a)"/><text x="952.0" y="314.0" font-size="11" font-weight="400" text-anchor="middle" fill="#ea580c" fill-opacity="1" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">starts BOTH at once</text><rect x="655" y="372" width="260" height="58" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="785.0" y="396.5" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">1  Measure each photo</text><text x="785.0" y="414.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">NumPy: sharpness · brightness · noise</text><rect x="655" y="450" width="260" height="58" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="785.0" y="474.5" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">2  Cut out the product</text><text x="785.0" y="492.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">rembg (U2-Net silueta), full-res alpha</text><polyline points="785.0,430 785.0,450" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><rect x="655" y="528" width="260" height="58" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="785.0" y="552.5" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">3  Refine the product itself</text><text x="785.0" y="570.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">OpenCV: denoise · 2× super-res · contrast</text><polyline points="785.0,508 785.0,528" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><rect x="655" y="606" width="260" height="58" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="785.0" y="630.5" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">4  Backdrop from photo stats</text><text x="785.0" y="648.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">Pillow: shadow · reflection · light sweep</text><polyline points="785.0,586 785.0,606" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><rect x="655" y="684" width="260" height="58" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="785.0" y="708.5" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">5  Render 4–6 shots</text><text x="785.0" y="726.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">FFmpeg: camera moves + crossfades</text><polyline points="785.0,664 785.0,684" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><rect x="975" y="372" width="260" height="58" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1105.0" y="396.5" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">1  Build prompts</text><text x="1105.0" y="414.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">facts · tone · platform · goal</text><rect x="975" y="450" width="260" height="58" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1105.0" y="474.5" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">2  Split kit into 4 + N parts</text><text x="1105.0" y="492.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">listing · social · video · one per platform</text><polyline points="1105.0,430 1105.0,450" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><rect x="975" y="528" width="260" height="58" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1105.0" y="552.5" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">3  Parallel LLM calls</text><text x="1105.0" y="570.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">Gemma 4B (Fast) or 12B (Best), JSON schema</text><polyline points="1105.0,508 1105.0,528" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><rect x="975" y="606" width="260" height="58" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1105.0" y="630.5" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">4  Check the copy</text><text x="1105.0" y="648.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">claims · numbers · forbidden · regulated</text><polyline points="1105.0,586 1105.0,606" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><rect x="975" y="684" width="260" height="58" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1105.0" y="708.5" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">5  Publish parts as they finish</text><text x="1105.0" y="726.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">UI shows copy while the rest writes</text><polyline points="1105.0,664 1105.0,684" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><polyline points="785,802 785,836" fill="none" stroke="#ea580c" stroke-opacity="1" stroke-width="2" marker-end="url(#arr-a)"/><polyline points="1105,802 1105,836" fill="none" stroke="#ea580c" stroke-opacity="1" stroke-width="2" marker-end="url(#arr-a)"/><rect x="655" y="838" width="580" height="84" rx="8" fill="#ea580c" fill-opacity="0.1" stroke="#ea580c" stroke-opacity="0.95"/><text x="945.0" y="868.0" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Image deck (Pillow), then final video (FFmpeg)</text><text x="945.0" y="886.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">deck: hero · benefits · close-up · angles · CTA, laid out from the finished copy</text><text x="945.0" y="901.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">video: motion clip + text cards, ffprobe-checked ≈ 10 s, H.264 yuv420p (plays on iPhone)</text><text x="945" y="950" font-size="11" font-weight="400" text-anchor="middle" fill="#ea580c" fill-opacity="0.9">The two lanes only meet here. A copy edit re-runs just this box, not the lanes.</text><rect x="1336" y="50" width="264" height="340" rx="12" fill="none" stroke="currentColor" stroke-opacity="0.28" stroke-dasharray="5 5"/><text x="1350" y="72" font-size="11" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="0.55">OUTSIDE (OPTIONAL)</text><rect x="1356" y="90" width="224" height="80" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1468.0" y="118.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Shopify Admin API</text><text x="1468.0" y="136.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">creates a DRAFT product</text><text x="1468.0" y="151.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">only when you tap · token from vault</text><rect x="1356" y="190" width="224" height="80" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1468.0" y="218.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Sentry</text><text x="1468.0" y="236.5" font-size="11" font-weight="400" text-anchor="middle" " text-anchor="middle" fill="currentColor" fill-opacity="0.72">and photo reading</text><text x="1468.0" y="576.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">Gemma 3 12B: Best-quality copy</text><text x="1468.0" y="591.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">chosen per job (Writing speed)</text><polyline points="1235,545 1356,545" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><text x="1295.5" y="537.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.85" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">4 + N JSON calls</text><rect x="1336" y="700" width="264" height="280" rx="12" fill="none" stroke="currentColor" stroke-opacity="0.28" stroke-dasharray="5 5"/><text x="1350" y="722" font-size="11" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="0.55">OFFLINE ONLY (NOT IN THE APP PATH)</text><rect x="1356" y="740" width="224" height="90" rx="8" fill="currentColor" fill-opacity="0.02" stroke="currentColor" stroke-opacity="0.55" stroke-dasharray="4 4"/><text x="1468.0" y="773.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="0.55">Tinker</text><text x="1468.0" y="791.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">LoRA training + hosted</text><text x="1468.0" y="806.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">sampling of the fine-tune</text><rect x="1356" y="850" width="224" height="90" rx="8" fill="currentColor" fill-opacity="0.02" stroke="currentColor" stroke-opacity="0.55" stroke-dasharray="4 4"/><text x="1468.0" y="891.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="0.55">Eval + judge scripts</text><text x="1468.0" y="909.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">rescore · bootstrap CIs</text></svg><figcaption>Every component and what moves between them. The orange parts are the mechanism worth understanding: the two lanes start together and only meet at the deck and final video.</figcaption></figure><figure><h2>2. The models, and what each one does</h2><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 660" role="img" aria-label="Which model or tool does which job, where it runs, and which ones are only used offline to build and measure the fine-tune" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" style="max-width:100%;height:auto"><title>Models and what each one does</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" fill-opacity="0.75"/></marker><marker id="arr-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="currentColor" fill-opacity="0.75"/></marker><marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="arr-a-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#ea580c"/></marker></defs><rect x="20" y="50" width="1580" height="230" rx="12" fill="none" stroke="currentColor" stroke-opacity="0.28" stroke-dasharray="5 5"/><text x="34" y="72" font-size="11" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="0.55">RUNS INSIDE THE APP, ON YOUR MACHINE</text><rect x="40" y="90" width="292" height="170" rx="8" fill="#ea580c" fill-opacity="0.1" stroke="#ea580c" stroke-opacity="0.95"/><text x="186.0" y="148.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Gemma 3 4B</text><text x="186.0" y="166.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">Ollama · open weights, local</text><text x="186.0" y="181.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">FAST copy (default) + photo reading</text><text x="186.0" y="196.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">temp 0.4 copy · 0.1 photos</text><text x="186.0" y="211.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">copy ≈ 14 s · whole kit ≈ 18 s</text><rect x="352" y="90" width="292" height="170" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="498.0" y="148.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Gemma 3 12B</text><text x="498.0" y="166.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">Ollama · open weights, local (8.2 GB)</text><text x="498.0" y="181.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">BEST-QUALITY copy, opt-in</text><text x="498.0" y="196.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">fewer flagged claims</text><text x="498.0" y="211.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">copy ≈ 53 s · whole kit ≈ 57 s</text><rect x="664" y="90" width="292" height="170" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="810.0" y="148.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">rembg · silueta (U2-Net)</text><text x="810.0" y="166.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">ONNX on CPU · 4 t x="1434.0" y="196.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">H.264 yuv420p, ffprobe-validated</text><text x="1434.0" y="211.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">NOT generative video</text><rect x="20" y="310" width="1580" height="230" rx="12" fill="none" stroke="currentColor" stroke-opacity="0.28" stroke-dasharray="5 5"/><text x="34" y="332" font-size="11" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="0.55">BUILT AND MEASURED OFFLINE (THE APP&#x27;S DEFAULT PATH DOES NOT CALL THESE)</text><rect x="40" y="350" width="292" height="170" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="186.0" y="408.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Qwen3.5-397B-A17B</text><text x="186.0" y="426.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">teacher · hosted on Tinker</text><text x="186.0" y="441.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">writes whole kits, then revises</text><text x="186.0" y="456.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">using the checker&#x27;s findings</text><text x="186.0" y="471.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">(max 2 rounds)</text><rect x="352" y="350" width="292" height="170" rx="8" fill="#ea580c" fill-opacity="0.1" stroke="#ea580c" stroke-opacity="0.95"/><text x="498.0" y="408.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Qwen3.5-4B + LoRA (v2)</text><text x="498.0" y="426.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">student · rank 32 · 3 epochs</text><text x="498.0" y="441.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">trained on 319 chat examples</text><text x="498.0" y="456.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">88% clean kits (60 held-out)</text><text x="498.0" y="471.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">4.9 s per kit, hosted on Tinker</text><rect x="664" y="350" width="292" height="170" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="810.0" y="408.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Qwen3.5-4B (untuned)</text><text x="810.0" y="426.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">baseline, same prompt</text><text x="810.0" y="441.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">18% clean kits</text><text x="810.0" y="456.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">3.7 s per kit</text><text x="810.0" y="471.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">shows what training added</text><rect x="976" y="350" width="292" height="170" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1122.0" y="408.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Gemma 3 12B as judge</text><text x="1122.0" y="426.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">reads each kit next to its facts</text><text x="1122.0" y="441.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">lists unsupported statements</text><text x="1122.0" y="456.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacit shopify (draft)</text><text x="20" y="800" font-size="11" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.8">The browser only ever talks to the Next proxy (one origin). The FastAPI process is never exposed directly, and every call needs the access code when one is set.</text><text x="20" y="822" font-size="11" font-weight="400" text-anchor="start" fill="#ea580c" fill-opacity="0.8">Sentry spans wrap the job and each model call; they carry metadata only (see the observability figure).</text></svg><figcaption>The order of calls from upload to export. The browser talks to one origin; the background job runs the two lanes and the UI polls it.</figcaption></figure><figure><h2>4. How the copy is written and checked</h2><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 960" role="img" aria-label="Facts become a seven-section prompt and a JSON schema, four core parts and one part per platform are written in parallel, then code validates, repairs only failed parts, and flags claims not in the facts" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" style="max-width:100%;height:auto"><title>Copy pipeline</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" fill-opacity="0.75"/></marker><marker id="arr-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="currentColor" fill-opacity="0.75"/></marker><marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="arr-a-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#ea580c"/></marker></defs><rect x="20" y="100" width="190" height="130" rx="8" fill="c
