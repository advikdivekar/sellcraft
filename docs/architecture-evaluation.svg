<svg style="color:#1b1815;background:#ffffff;max-width:100%;height:auto" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 760" role="img" aria-label="Clean-kit rates with confidence intervals for five models, and the independent judge&#x27;s flags per kit" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Evaluation results</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" fill-opacity="0.75"/></marker><marker id="arr-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="currentColor" fill-opacity="0.75"/></marker><marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="arr-a-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#ea580c"/></marker></defs><text x="20" y="34" font-size="13" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="1.0">A.  Clean kits on 60 held-out products (deterministic checker, all runs re-scored today). Whiskers = 95% bootstrap interval.</text><line x1="250.0" y1="58" x2="250.0" y2="290" stroke="currentColor" stroke-opacity="0.12"/><text x="250.0" y="306" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.6">0%</text><line x1="400.0" y1="58" x2="400.0" y2="290" stroke="currentColor" stroke-opacity="0.12"/><text x="400.0" y="306" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.6">25%</text><line x1="550.0" y1="58" x2="550.0" y2="290" stroke="currentColor" stroke-opacity="0.12"/><text x="550.0" y="306" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.6">50%</text><line x1="700.0" y1="58" x2="700.0" y2="290" stroke="currentColor" stroke-opacity="0.12"/><text x="700.0" y="306" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.6">75%</text><line x1="850.0" y1="58" x2="850.0" y2="290" stroke="currentColor" stroke-opacity="0.12"/><text x="850.0" y="306" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.6">100%</text><text x="20" y="92" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1.0">Qwen3.5-4B, untuned</text><rect x="250" y="70" width="108.0" height="30" rx="5" fill="currentColor" fill-opacity="0.32"/><line x1="310.0" y1="85" x2="418.0" y2="85" stroke="currentColor" stroke-width="2"/><line x1="310.0" y1="78" x2="310.0" y2="92" stroke="currentColor" stroke-width="2"/><line x1="418.0" y1="78" x2="418.0" y2="92" stroke="currentColor" stroke-width="2"/><text x="432.0" y="90" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1.0">18%  (10–28)</text><text x="20" y="136" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1.0">Gemma 3 4B</text><rect x="250" y="114" width="138.0" height="30" rx="5" fill="currentColor" fill-opacity="0.32"/><line x1="328.0" y1="129" x2="460.0" y2="129" stroke="currentColor" stroke-width="2"/><line x1="328.0" y1="122" x2="328.0" y2="136" stroke="currentColor" stroke-width="2"/><line x1="460.0" y1="122" x2="460.0" y2="136" stroke="currentColor" stroke-width="2"/><text x="474.0" y="134" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1.0">23%  (13–35)</text><text x="20" y="180" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1.0">Gemma 3 12B</text><rect x="250" y="158" width="270.0" height="30" rx="5" fill="currentColor" fill-opacity="0.32"/><line x1="448.0" y1="173" x2="592.0" y2="173" stroke="currentColor" stroke-width="2"/><line x1="448.0" y1="166" x2="448.0" y2="180" stroke="currentColor" stroke-width="2"/><line x1="592.0" y1="166" x2="592.0" y2="180" stroke="currentColor" stroke-width="2"/><text x="606.0" y="178" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1.0">45%  (33–57)</text><text x="20" y="224" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1.0">Fine-tune v1</text><rect x="250" y="202" width="390.0" height="30" rx="5" fill="currentColor" fill-opacity="0.32"/><line x1="568.0" y1="217" x2="712.0" y2="217" stroke="currentColor" stroke-width="2"/><line x1="568.0" y1="210" x2="568.0" y2="224" stroke="currentColor" stroke-width="2"/><line x1="712.0" y1="210" x2="712.0" y2="224" stroke="currentColor" stroke-width="2"/><text x="726.0" y="222" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1.0">65%  (53–77)</text><text x="20" y="268" font-size="12" font-weight="600" text-anchor="start" fill="currentColor" fill-opacity="1.0">Fine-tune v2</text><rect x="250" y="246" width="528.0" height="30" rx="5" fill="#ea580c" fill-opacity="0.85"/><line x1="718.0" y1="261" x2="820.0" y2="261" stroke="#ea580c" stroke-width="2"/><line x1="718.0" y1="254" x2="718.0" y2="268" stroke="#ea580c" stroke-width="2"/><line x1="820.0" y1="254" x2="820.0" y2="268" stroke="#ea580c" stroke-width="2"/><text x="834.0" y="266" font-size="12" font-weight="700" text-anchor="start" fill="#ea580c" fill-opacity="1.0">88%  (78–95)</text><text x="20" y="360" font-size="13" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="1.0">B.  Independent judge: unsupported statements per kit (n = 30 per model, lower is better)</text><line x1="250.0" y1="384" x2="250.0" y2="600" stroke="currentColor" stroke-opacity="0.12"/><text x="250.0" y="616" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.6">0</text><line x1="332.5" y1="384" x2="332.5" y2="600" stroke="currentColor" stroke-opacity="0.12"/><text x="332.5" y="616" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.6">0.25</text><line x1="415.0" y1="384" x2="415.0" y2="600" stroke="currentColor" stroke-opacity="0.12"/><text x="415.0" y="616" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.6">0.5</text><line x1="497.5" y1="384" x2="497.5" y2="600" stroke="currentColor" stroke-opacity="0.12"/><text x="497.5" y="616" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.6">0.75</text><line x1="580.0" y1="384" x2="580.0" y2="600" stroke="currentColor" stroke-opacity="0.12"/><text x="580.0" y="616" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.6">1</text><text x="20" y="414" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1.0">Gemma 3 12B</text><rect x="250" y="392" width="42.9" height="28" rx="5" fill="currentColor" fill-opacity="0.32"/><line x1="259.9" y1="406" x2="339.1" y2="406" stroke="currentColor" stroke-width="2"/><text x="353.1" y="411" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1.0">0.13  (0.03–0.27)</text><text x="20" y="456" font-size="12" font-weight="600" text-anchor="start" fill="currentColor" fill-opacity="1.0">Fine-tune v2</text><rect x="250" y="434" width="66.0" height="28" rx="5" fill="#ea580c" fill-opacity="0.85"/><line x1="273.1" y1="448" x2="372.1" y2="448" stroke="#ea580c" stroke-width="2"/><text x="386.1" y="453" font-size="12" font-weight="700" text-anchor="start" fill="#ea580c" fill-opacity="1.0">0.20  (0.07–0.37)</text><text x="20" y="498" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1.0">Gemma 3 4B</text><rect x="250" y="476" width="66.0" height="28" rx="5" fill="currentColor" fill-opacity="0.32"/><line x1="273.1" y1="490" x2="372.1" y2="490" stroke="currentColor" stroke-width="2"/><text x="386.1" y="495" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1.0">0.20  (0.07–0.37)</text><text x="20" y="540" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1.0">Qwen3.5-4B, untuned</text><rect x="250" y="518" width="141.9" height="28" rx="5" fill="currentColor" fill-opacity="0.32"/><line x1="283.0" y1="532" x2="523.9" y2="532" stroke="currentColor" stroke-width="2"/><text x="537.9" y="537" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1.0">0.43  (0.10–0.83)</text><text x="20" y="582" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1.0">Fine-tune v1</text><rect x="250" y="560" width="207.9" height="28" rx="5" fill="currentColor" fill-opacity="0.32"/><line x1="316.0" y1="574" x2="636.0999999999999" y2="574" stroke="currentColor" stroke-width="2"/><text x="650.0999999999999" y="579" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1.0">0.63  (0.20–1.17)</text><rect x="1010" y="70" width="590" height="560" rx="12" fill="none" stroke="currentColor" stroke-opacity="0.28" stroke-dasharray="5 5"/><text x="1024" y="92" font-size="11" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="0.55">HOW TO READ THIS</text><text x="1034" y="112" font-size="12" font-weight="600" text-anchor="start" fill="currentColor" fill-opacity="0.9">The fine-tune clearly learned the rules it was trained on:</text><text x="1034" y="136" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">18% → 88% clean kits, far outside the intervals.</text><text x="1034" y="160" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9"></text><text x="1034" y="184" font-size="12" font-weight="600" text-anchor="start" fill="currentColor" fill-opacity="0.9">The independent judge is more modest: v2 halves the</text><text x="1034" y="208" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">untuned model&#x27;s flags (0.43 → 0.20) and is level with</text><text x="1034" y="232" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">Gemma 4B, but the intervals overlap, and Gemma 12B</text><text x="1034" y="256" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">is lower still. n = 30 cannot show more.</text><text x="1034" y="280" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9"></text><text x="1034" y="304" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">v1 was WORSE than its base on the judge (0.63): it had</text><text x="1034" y="328" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">learned the checker&#x27;s word list, not the idea. That is</text><text x="1034" y="352" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">why v2 trains only on kits the judge also passed.</text><text x="1034" y="376" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9"></text><text x="1034" y="400" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">The judge is Gemma, so it may be kind to Gemma&#x27;s own</text><text x="1034" y="424" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">writing. That bias favours the Gemma rows, i.e. it works</text><text x="1034" y="448" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">against the fine-tune&#x27;s claim.</text><text x="1034" y="472" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9"></text><text x="1034" y="496" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">Synthetic products only. No real-seller test yet.</text><text x="20" y="660" font-size="11" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.8">Source: docs/RESULTS.md, regenerated with `python -m finetune.rescore` and `python -m finetune.judge`. Clean kit = no unsupported claim, invented number, forbidden word, placeholder or invalid JSON.</text><text x="20" y="682" font-size="11" font-weight="400" text-anchor="start" fill="#ea580c" fill-opacity="0.8">Caveat: the checker also filtered the training data, so rule-following is partly &#x27;trained against&#x27;. The judge is the independent check.</text></svg>