<svg style="color:#1b1815;background:#ffffff;max-width:100%;height:auto" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 680" role="img" aria-label="Copy and video run at the same time and meet at the deck and final video, and the Fast default cut a four-photo kit from about 100 seconds to about 18" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Pipeline timing</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" fill-opacity="0.75"/></marker><marker id="arr-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="currentColor" fill-opacity="0.75"/></marker><marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="arr-a-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#ea580c"/></marker></defs><line x1="290.0" y1="54" x2="290.0" y2="330" stroke="currentColor" stroke-opacity="0.12"/><text x="290.0" y="40" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.6">0 s</text><line x1="400.0" y1="54" x2="400.0" y2="330" stroke="currentColor" stroke-opacity="0.12"/><text x="400.0" y="40" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.6">10 s</text><line x1="510.0" y1="54" x2="510.0" y2="330" stroke="currentColor" stroke-opacity="0.12"/><text x="510.0" y="40" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.6">20 s</text><line x1="620.0" y1="54" x2="620.0" y2="330" stroke="currentColor" stroke-opacity="0.12"/><text x="620.0" y="40" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.6">30 s</text><line x1="730.0" y1="54" x2="730.0" y2="330" stroke="currentColor" stroke-opacity="0.12"/><text x="730.0" y="40" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.6">40 s</text><line x1="840.0" y1="54" x2="840.0" y2="330" stroke="currentColor" stroke-opacity="0.12"/><text x="840.0" y="40" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.6">50 s</text><line x1="950.0" y1="54" x2="950.0" y2="330" stroke="currentColor" stroke-opacity="0.12"/><text x="950.0" y="40" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.6">60 s</text><line x1="1060.0" y1="54" x2="1060.0" y2="330" stroke="currentColor" stroke-opacity="0.12"/><text x="1060.0" y="40" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.6">70 s</text><line x1="1170.0" y1="54" x2="1170.0" y2="330" stroke="currentColor" stroke-opacity="0.12"/><text x="1170.0" y="40" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.6">80 s</text><line x1="1280.0" y1="54" x2="1280.0" y2="330" stroke="currentColor" stroke-opacity="0.12"/><text x="1280.0" y="40" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.6">90 s</text><line x1="1390.0" y1="54" x2="1390.0" y2="330" stroke="currentColor" stroke-opacity="0.12"/><text x="1390.0" y="40" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.6">100 s</text><line x1="1500.0" y1="54" x2="1500.0" y2="330" stroke="currentColor" stroke-opacity="0.12"/><text x="1500.0" y="40" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.6">110 s</text><text x="20" y="18" font-size="11" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="0.6">Time since you tap Generate (4 photos, GPU otherwise idle)</text><text x="20" y="92" font-size="12" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="1.0">FIRST VERSION</text><text x="20" y="110" font-size="11" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.65">one big 12B call, then video</text><rect x="290.0" y="70" width="990.0" height="40" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="785.0" y="93.0" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Write the whole kit in one call (Gemma 12B)</text><rect x="1280.0" y="70" width="143.0" height="40" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1351.5" y="93.0" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Video</text><text x="1435.0" y="96" font-size="13" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="0.9">≈ 100 s</text><text x="20" y="192" font-size="12" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="1.0">PARALLEL PARTS</text><text x="20" y="210" font-size="11" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.65">Best quality (12B), lanes overlap</text><rect x="290.0" y="150" width="583.0" height="34" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="581.5" y="170.0" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Copy: 4 + N parts at once</text><rect x="290.0" y="190" width="139.7" height="34" rx="8" fill="#ea580c" fill-opacity="0.1" stroke="#ea580c" stroke-opacity="0.95"/><text x="359.85" y="210.0" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Video</text><rect x="873.0" y="150" width="44.0" height="74" rx="8" fill="#ea580c" fill-opacity="0.1" stroke="#ea580c" stroke-opacity="0.95"/><text x="895.0" y="190.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1"></text><text x="929.0" y="192" font-size="13" font-weight="700" text-anchor="start" fill="#ea580c" fill-opacity="1.0">≈ 57 s</text><text x="20" y="282" font-size="12" font-weight="700" text-anchor="start" fill="#ea580c" fill-opacity="1.0">FAST (default)</text><text x="20" y="300" font-size="11" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.65">Gemma 4B, lanes overlap</text><rect x="290.0" y="262" width="154.0" height="30" rx="8" fill="#ea580c" fill-opacity="0.1" stroke="#ea580c" stroke-opacity="0.95"/><text x="367.0" y="280.0" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Copy</text><rect x="290.0" y="296" width="139.7" height="30" rx="8" fill="#ea580c" fill-opacity="0.1" stroke="#ea580c" stroke-opacity="0.95"/><text x="359.85" y="314.0" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Video</text><rect x="444.0" y="262" width="38.5" height="64" rx="8" fill="#ea580c" fill-opacity="0.1" stroke="#ea580c" stroke-opacity="0.95"/><text x="463.25" y="297.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1"></text><text x="494.5" y="300" font-size="13" font-weight="700" text-anchor="start" fill="#ea580c" fill-opacity="1.0">≈ 18 s</text><text x="20" y="374" font-size="13" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="1.0">Where the time goes now (Fast, 4 photos)</text><text x="20" y="402" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1.0">Copy (Gemma 4B, 4+N parallel calls)</text><text x="520" y="402" font-size="12" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="1.0">≈ 14 s</text><text x="620" y="402" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.75">the slowest lane</text><text x="20" y="426" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1.0">Video: refine photos + render shots</text><text x="520" y="426" font-size="12" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="1.0">≈ 12.7 s</text><text x="620" y="426" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.75">starts at t = 0, runs alongside</text><text x="20" y="450" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1.0">Deck (Pillow)</text><text x="520" y="450" font-size="12" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="1.0">≈ 1.4 s</text><text x="620" y="450" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.75">needs the finished copy</text><text x="20" y="474" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1.0">Assembly (text cards + final encode)</text><text x="520" y="474" font-size="12" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="1.0">≈ 1.6 s</text><text x="620" y="474" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.75">veryfast H.264</text><text x="20" y="520" font-size="12" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="1.0">Job states (stored in SQLite, polled by the UI)</text><rect x="20" y="538" width="68.0" height="30" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="54.0" y="555.5" font-size="11" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">queued</text><rect x="140" y="538" width="131.0" height="30" rx="8" fill="#ea580c" fill-opacity="0.1" stroke="#ea580c" stroke-opacity="0.95"/><text x="205.5" y="555.5" font-size="11" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">generating_copy</text><rect x="320" y="538" width="138.0" height="30" rx="8" fill="#ea580c" fill-opacity="0.1" stroke="#ea580c" stroke-opacity="0.95"/><text x="389.0" y="555.5" font-size="11" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">generating_video</text><rect x="540" y="538" width="138.0" height="30" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="609.0" y="555.5" font-size="11" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">assembling_video</text><rect x="760" y="538" width="89.0" height="30" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="804.5" y="555.5" font-size="11" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">completed</text><polyline points="88.0,553 140,553" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><polyline points="271.0,553 320,553" fill="none" stroke="#ea580c" stroke-opacity="1" stroke-width="2" marker-end="url(#arr-a)"/><text x="295.5" y="541.0" font-size="11" font-weight="400" text-anchor="middle" fill="#ea580c" fill-opacity="1" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">run together</text><polyline points="458.0,553 540,553" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><text x="499.0" y="541.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.85" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">deck builds here</text><polyline points="678.0,553 760,553" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><rect x="940" y="538" width="70" height="30" rx="8" fill="currentColor" fill-opacity="0.02" stroke="currentColor" stroke-opacity="0.55" stroke-dasharray="4 4"/><text x="975.0" y="555.5" font-size="11" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="0.55">failed</text><text x="1026" y="558" font-size="11" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.8">a failed video keeps the copy; Try again skips the copy step</text><text x="20" y="620" font-size="11" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.8">Measured with job stage timings from the app&#x27;s database (copy 52–105 s on 12B, video 10–18 s, deck 1–2 s, assembly 4–5 s before the encode change) and 4 photos.</text><text x="20" y="640" font-size="11" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.8">Times vary with the model already being in memory (a cold 12B load adds ~13 s) and with other work sharing the GPU.</text></svg>