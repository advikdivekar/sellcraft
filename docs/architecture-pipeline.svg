<svg style="color:#1b1815;background:#ffffff;max-width:100%;height:auto" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 560" role="img" aria-label="Copy and video are produced at the same time and meet at the deck and final video, so the wait is the slower lane plus a few seconds, not the sum" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Pipeline timing</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" fill-opacity="0.75"/></marker><marker id="arr-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="currentColor" fill-opacity="0.75"/></marker><marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="arr-a-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#ea580c"/></marker></defs><line x1="230.0" y1="54" x2="230.0" y2="290" stroke="currentColor" stroke-opacity="0.12"/><text x="230.0" y="40" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.6">0 s</text><line x1="410.0" y1="54" x2="410.0" y2="290" stroke="currentColor" stroke-opacity="0.12"/><text x="410.0" y="40" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.6">10 s</text><line x1="590.0" y1="54" x2="590.0" y2="290" stroke="currentColor" stroke-opacity="0.12"/><text x="590.0" y="40" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.6">20 s</text><line x1="770.0" y1="54" x2="770.0" y2="290" stroke="currentColor" stroke-opacity="0.12"/><text x="770.0" y="40" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.6">30 s</text><line x1="950.0" y1="54" x2="950.0" y2="290" stroke="currentColor" stroke-opacity="0.12"/><text x="950.0" y="40" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.6">40 s</text><line x1="1130.0" y1="54" x2="1130.0" y2="290" stroke="currentColor" stroke-opacity="0.12"/><text x="1130.0" y="40" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.6">50 s</text><line x1="1310.0" y1="54" x2="1310.0" y2="290" stroke="currentColor" stroke-opacity="0.12"/><text x="1310.0" y="40" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.6">60 s</text><line x1="1490.0" y1="54" x2="1490.0" y2="290" stroke="currentColor" stroke-opacity="0.12"/><text x="1490.0" y="40" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.6">70 s</text><text x="20" y="40" font-size="11" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="0.6">Time since you tap Generate</text><text x="20" y="92" font-size="12" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="1.0">SEQUENTIAL</text><text x="20" y="110" font-size="11" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.65">what the first version did</text><rect x="230.0" y="70" width="810.0" height="40" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="635.0" y="93.0" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Write copy (Gemma 12B)</text><rect x="1040.0" y="70" width="288.0" height="40" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1184.0" y="93.0" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Build video</text><text x="1342.0" y="95" font-size="13" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="0.9">≈ 65 s</text><text x="20" y="202" font-size="12" font-weight="700" text-anchor="start" fill="#ea580c" fill-opacity="1.0">OVERLAPPED</text><text x="20" y="220" font-size="11" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.65">what runs now</text><text x="220.0" y="174" font-size="11" font-weight="400" text-anchor="end" fill="currentColor" fill-opacity="0.75">language lane</text><text x="220.0" y="246" font-size="11" font-weight="400" text-anchor="end" fill="currentColor" fill-opacity="0.75">visual lane</text><rect x="230.0" y="150" width="810.0" height="40" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="635.0" y="173.0" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Write copy: 5–6 parts in parallel</text><circle cx="590.0" cy="190" r="4" fill="#ea580c"/><circle cx="824.0" cy="190" r="4" fill="#ea580c"/><text x="590.0" y="210" font-size="11" font-weight="400" text-anchor="middle" fill="#ea580c" fill-opacity="1.0" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">first parts appear in the editor (read-only)</text><rect x="230.0" y="226" width="288.0" height="40" rx="8" fill="#ea580c" fill-opacity="0.1" stroke="#ea580c" stroke-opacity="0.95"/><text x="374.0" y="249.0" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Refine photos + render shots</text><line x1="524.0" y1="246" x2="1036.0" y2="246" stroke="currentColor" stroke-opacity="0.4" stroke-dasharray="3 4"/><text x="788.0" y="238" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.7" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">video ready at 16 s, waits for the copy</text><rect x="1040.0" y="150" width="72.0" height="116" rx="8" fill="#ea580c" fill-opacity="0.1" stroke="#ea580c" stroke-opacity="0.95"/><text x="1076.0" y="211.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1"></text><text x="1076.0" y="204" font-size="11" font-weight="700" text-anchor="middle" fill="#ea580c" fill-opacity="1.0">deck</text><text x="1076.0" y="219" font-size="11" font-weight="400" text-anchor="middle" fill="#ea580c" fill-opacity="1.0">+ text</text><text x="1126.0" y="214" font-size="13" font-weight="700" text-anchor="start" fill="#ea580c" fill-opacity="1.0">≈ 49 s</text><text x="1126.0" y="232" font-size="11" font-weight="400" text-anchor="start" fill="#ea580c" fill-opacity="1.0">copy visible from ~20 s</text><text x="20" y="330" font-size="12" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="1.0">Where the saving comes from (measured on an 18 GB Mac)</text><text x="20" y="354" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.88">•  Video needs only the photos, never the copy, so it starts at t = 0 instead of waiting.</text><text x="20" y="376" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.88">•  Ollama serves requests together (OLLAMA_NUM_PARALLEL=4). Decoding is memory-bound, so 3 parallel calls took 19 s instead of 37 s.</text><text x="20" y="398" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.88">•  Each parallel call re-reads its prompt, so every part gets only the sections it needs: 6 parts went from 63 s to 46 s.</text><text x="20" y="420" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.88">•  A leftover [placeholder] is stripped in place and only parts that really failed are re-run, so there is no second full round.</text><text x="20" y="462" font-size="12" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="1.0">Job states (stored in SQLite, polled by the UI)</text><rect x="20" y="478" width="68.0" height="30" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="54.0" y="495.5" font-size="11" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">queued</text><rect x="140" y="478" width="131.0" height="30" rx="8" fill="#ea580c" fill-opacity="0.1" stroke="#ea580c" stroke-opacity="0.95"/><text x="205.5" y="495.5" font-size="11" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">generating_copy</text><rect x="320" y="478" width="138.0" height="30" rx="8" fill="#ea580c" fill-opacity="0.1" stroke="#ea580c" stroke-opacity="0.95"/><text x="389.0" y="495.5" font-size="11" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">generating_video</text><rect x="520" y="478" width="54.0" height="30" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="547.0" y="495.5" font-size="11" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">deck</text><rect x="600" y="478" width="138.0" height="30" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="669.0" y="495.5" font-size="11" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">assembling_video</text><rect x="800" y="478" width="89.0" height="30" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="844.5" y="495.5" font-size="11" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">completed</text><polyline points="88.0,493 140,493" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><polyline points="271.0,493 320,493" fill="none" stroke="#ea580c" stroke-opacity="1" stroke-width="2" marker-end="url(#arr-a)"/><text x="295.5" y="484.0" font-size="11" font-weight="400" text-anchor="middle" fill="#ea580c" fill-opacity="1" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">run together</text><polyline points="458.0,493 520,493" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><polyline points="574.0,493 600,493" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><polyline points="738.0,493 800,493" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><rect x="960" y="478" width="70" height="30" rx="8" fill="currentColor" fill-opacity="0.02" stroke="currentColor" stroke-opacity="0.55" stroke-dasharray="4 4"/><text x="995.0" y="495.5" font-size="11" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="0.55">failed</text><text x="1046" y="498" font-size="11" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.8">a failed video keeps the copy; Try again skips the copy step</text></svg>