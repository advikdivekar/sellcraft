<svg style="color:#1b1815;background:#ffffff;max-width:100%;height:auto" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 860" role="img" aria-label="Each speed change with its measured before and after and where it lives in the code" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Optimisations</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" fill-opacity="0.75"/></marker><marker id="arr-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="currentColor" fill-opacity="0.75"/></marker><marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="arr-a-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#ea580c"/></marker></defs><text x="20" y="34" font-size="14" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="1.0">What we changed to make it fast, measured</text><text x="20" y="66" font-size="11" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="0.6">OPTIMISATION</text><text x="330" y="66" font-size="11" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="0.6">BEFORE → AFTER</text><text x="800" y="66" font-size="11" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="0.6">WHY IT WORKS</text><text x="1260" y="66" font-size="11" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="0.6">WHERE</text><rect x="14" y="80" width="1592" height="50" rx="8" fill="#ea580c" fill-opacity="0.09"/><text x="26" y="110" font-size="13" font-weight="600" text-anchor="start" fill="currentColor" fill-opacity="1.0">Overlap the two lanes</text><text x="330" y="110" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1.0">video waited for the copy → video starts at t = 0</text><text x="800" y="110" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.85">wait = slower lane + ~3 s</text><text x="1260" y="110" font-size="11" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.65">jobs.run_generation</text><rect x="14" y="140" width="1592" height="50" rx="8" fill="#ea580c" fill-opacity="0.09"/><text x="26" y="170" font-size="13" font-weight="600" text-anchor="start" fill="currentColor" fill-opacity="1.0">Split copy into 4 + N parts</text><text x="330" y="170" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1.0">one 12B call 90–145 s → parts in parallel 45–60 s</text><text x="800" y="170" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.85">OLLAMA_NUM_PARALLEL=4 (3 calls 19 s vs 37 s)</text><text x="1260" y="170" font-size="11" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.65">copy._chunks / _run</text><rect x="14" y="200" width="1592" height="50" rx="8" fill="#ea580c" fill-opacity="0.09"/><text x="26" y="230" font-size="13" font-weight="600" text-anchor="start" fill="currentColor" fill-opacity="1.0">Fast mode is the default</text><text x="330" y="230" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1.0">copy 53 s → 14 s · whole kit 57 s → 18 s</text><text x="800" y="230" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.85">Gemma 4B; Best quality (12B) is a switch</text><text x="1260" y="230" font-size="11" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.65">config.ollama_fast_model</text><rect x="14" y="260" width="1592" height="50" rx="8" fill="currentColor" fill-opacity="0.04"/><text x="26" y="290" font-size="13" font-weight="600" text-anchor="start" fill="currentColor" fill-opacity="1.0">Trim each part&#x27;s prompt</text><text x="330" y="290" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1.0">6 parts 63 s → 46 s</text><text x="800" y="290" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.85">every parallel call re-reads its prompt</text><text x="1260" y="290" font-size="11" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.65">prompts.build_user_prompt(fields)</text><rect x="14" y="320" width="1592" height="50" rx="8" fill="currentColor" fill-opacity="0.04"/><text x="26" y="350" font-size="13" font-weight="600" text-anchor="start" fill="currentColor" fill-opacity="1.0">Redo only failed parts</text><text x="330" y="350" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1.0">no second full round</text><text x="800" y="350" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.85">placeholders stripped in place and flagged</text><text x="1260" y="350" font-size="11" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.65">copy.generate</text><rect x="14" y="380" width="1592" height="50" rx="8" fill="currentColor" fill-opacity="0.04"/><text x="26" y="410" font-size="13" font-weight="600" text-anchor="start" fill="currentColor" fill-opacity="1.0">Mask small, alpha at full size</text><text x="330" y="410" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1.0">fast cut-out and no pixels lost</text><text x="800" y="410" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.85">mask on ≤1400 px, scaled to the photo</text><text x="1260" y="410" font-size="11" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.65">studio.cutout</text><rect x="14" y="440" width="1592" height="50" rx="8" fill="currentColor" fill-opacity="0.04"/><text x="26" y="470" font-size="13" font-weight="600" text-anchor="start" fill="currentColor" fill-opacity="1.0">3 workers for photos and shots</text><text x="330" y="470" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1.0">photo prep + shot rendering in parallel</text><text x="800" y="470" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.85">ThreadPool(3)</text><text x="1260" y="470" font-size="11" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.65">provider.generate</text><rect x="14" y="500" width="1592" height="50" rx="8" fill="currentColor" fill-opacity="0.04"/><text x="26" y="530" font-size="13" font-weight="600" text-anchor="start" fill="currentColor" fill-opacity="1.0">Cheaper final encode</text><text x="330" y="530" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1.0">assembly ≈ 4–5 s → ≈ 1.6 s</text><text x="800" y="530" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.85">libx264 veryfast (was medium)</text><text x="1260" y="530" font-size="11" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.65">assemble.py</text><rect x="14" y="560" width="1592" height="50" rx="8" fill="currentColor" fill-opacity="0.04"/><text x="26" y="590" font-size="13" font-weight="600" text-anchor="start" fill="currentColor" fill-opacity="1.0">Re-render only the overlay on edit</text><text x="330" y="590" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1.0">no new clip, no new lanes</text><text x="800" y="590" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.85">old video kept until the new one is valid</text><text x="1260" y="590" font-size="11" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.65">jobs.run_reassembly</text><rect x="14" y="620" width="1592" height="50" rx="8" fill="currentColor" fill-opacity="0.04"/><text x="26" y="650" font-size="13" font-weight="600" text-anchor="start" fill="currentColor" fill-opacity="1.0">Show copy as parts land</text><text x="330" y="650" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1.0">text visible while the rest writes</text><text x="800" y="650" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.85">progress is computed from real stage states</text><text x="1260" y="650" font-size="11" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.65">jobs partial callback</text><rect x="14" y="680" width="1592" height="50" rx="8" fill="currentColor" fill-opacity="0.04"/><text x="26" y="710" font-size="13" font-weight="600" text-anchor="start" fill="currentColor" fill-opacity="1.0">Keep the model warm</text><text x="330" y="710" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1.0">no ~13 s reload between kits</text><text x="800" y="710" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.85">OLLAMA_KEEP_ALIVE=1h</text><text x="1260" y="710" font-size="11" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.65">README setup</text><rect x="14" y="740" width="1592" height="50" rx="8" fill="currentColor" fill-opacity="0.04"/><text x="26" y="770" font-size="13" font-weight="600" text-anchor="start" fill="currentColor" fill-opacity="1.0">Proxy waits 5 minutes</text><text x="330" y="770" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1.0">a &gt;30 s photo scan no longer shows a 500</text><text x="800" y="770" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.85">Next proxyTimeout</text><text x="1260" y="770" font-size="11" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.65">next.config.ts</text><text x="20" y="820" font-size="11" font-weight="400" text-anchor="start" fill="#ea580c" fill-opacity="0.85">The biggest single win is the model choice (Fast 4B), then splitting the kit into parallel parts, then overlapping the lanes. Quality trade: 4B gets more claims flagged than 12B, and the post-check still catches them.</text></svg>