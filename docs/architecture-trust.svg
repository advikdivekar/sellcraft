<svg style="color:#1b1815;background:#ffffff;max-width:100%;height:auto" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 800" role="img" aria-label="What stays on the seller&#x27;s machine and exactly what can leave it, to which service, and only when" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Trust boundary</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" fill-opacity="0.75"/></marker><marker id="arr-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="currentColor" fill-opacity="0.75"/></marker><marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="arr-a-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#ea580c"/></marker></defs><rect x="20" y="50" width="1000" height="650" rx="12" fill="none" stroke="#ea580c" stroke-opacity="0.9" stroke-dasharray="5 5"/><text x="34" y="72" font-size="11" font-weight="700" text-anchor="start" fill="#ea580c" fill-opacity="1">YOUR MACHINE: SELLER DATA STAYS HERE</text><rect x="60" y="100" width="240" height="90" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="180.0" y="141.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Browser / phone</text><text x="180.0" y="159.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">photos, facts, edits</text><rect x="330" y="100" width="240" height="90" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="450.0" y="141.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Next.js</text><text x="450.0" y="159.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">UI + proxy</text><rect x="600" y="100" width="240" height="90" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="720.0" y="141.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">FastAPI</text><text x="720.0" y="159.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">jobs · checks</text><rect x="600" y="250" width="240" height="90" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="720.0" y="291.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Ollama</text><text x="720.0" y="309.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">Gemma reads + writes</text><rect x="330" y="250" width="240" height="90" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="450.0" y="291.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Image + video work</text><text x="450.0" y="309.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">rembg · OpenCV · FFmpeg</text><rect x="60" y="250" width="240" height="90" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="180.0" y="291.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">SQLite + disk</text><text x="180.0" y="309.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">facts, photos, outputs</text><rect x="330" y="400" width="240" height="90" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="450.0" y="433.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Vault</text><text x="450.0" y="451.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">Shopify token, encrypted</text><text x="450.0" y="466.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">used only for the draft</text><rect x="600" y="400" width="240" height="90" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="720.0" y="441.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Allow-list scrubber</text><text x="720.0" y="459.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">metadata only leaves</text><polyline points="300,145 330,145" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><polyline points="570,145 600,145" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><polyline points="720,190 720,250" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><polyline points="600,295 570,295" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><polyline points="330,295 300,295" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><text x="60" y="560" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">Photos, product facts and generated copy are processed by local open models.</text><text x="60" y="584" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">Nothing is posted anywhere unless the seller taps a button.</text><text x="60" y="608" font-size="12" font-weight="400" text-anchor="start" fill="#ea580c" fill-opacity="0.9">The fine-tune (hosted on Tinker) is NOT in this path: using it would send facts out.</text><text x="60" y="640" font-size="11" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.8">Caveat: a Cloudflare tunnel passes traffic through Cloudflare, so use it for demos, with the access code, not for sensitive photos.</text><rect x="1080" y="50" width="520" height="650" rx="12" fill="none" stroke="currentColor" stroke-opacity="0.28" stroke-dasharray="5 5"/><text x="1094" y="72" font-size="11" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="0.55">OUTSIDE, AND EXACTLY WHAT CROSSES</text><rect x="1110" y="90" width="460" height="86" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1340.0" y="121.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Shopify</text><text x="1340.0" y="139.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">on tap only: draft product with title,</text><text x="1340.0" y="154.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">copy, photos, video. Token from the vault.</text><rect x="1110" y="200" width="460" height="86" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1340.0" y="231.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Sentry (optional)</text><text x="1340.0" y="249.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">scrubbed metadata: model, tokens,</text><text x="1340.0" y="264.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">latency, flag rule + word. Never text.</text><rect x="1110" y="310" width="460" height="86" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1340.0" y="341.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Tinker (offline)</text><text x="1340.0" y="359.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">synthetic training data and eval kits.</text><text x="1340.0" y="374.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">No real seller data was ever sent.</text><rect x="1110" y="420" width="460" height="86" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1340.0" y="451.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">GitHub (public repo)</text><text x="1340.0" y="469.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">code, docs, screenshots. No seller data,</text><text x="1340.0" y="484.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">no keys (scanned before going public).</text><rect x="1110" y="530" width="460" height="86" rx="8" fill="currentColor" fill-opacity="0.02" stroke="currentColor" stroke-opacity="0.55" stroke-dasharray="4 4"/><text x="1340.0" y="569.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="0.55">ElevenLabs</text><text x="1340.0" y="587.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">voiceover is not built: nothing is sent.</text><polyline points="840,430 1060,430 1060,243 1110,243" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/><text x="950.0" y="422.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.85" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">metadata</text><polyline points="840,140 1060,140 1060,133 1110,133" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/><text x="950.0" y="132.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.85" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">on tap</text><text x="20" y="740" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">Open-model benefit, concretely: with Gemma through Ollama, the seller&#x27;s product data never needs to leave their computer to get a full kit, and there is no per-kit fee.</text><text x="20" y="764" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">Where closed would be better: a frontier API would probably write nicer prose with no training, at the cost of sending every product&#x27;s facts to a third party.</text></svg>