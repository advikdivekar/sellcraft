<svg style="color:#1b1815;background:#ffffff;max-width:100%;height:auto" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 720" role="img" aria-label="A strong teacher writes copy, code and an independent judge reject anything that breaks the rules, and only clean kits train a small student that is then tested on held-out products" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Fine-tuning loop</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" fill-opacity="0.75"/></marker><marker id="arr-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="currentColor" fill-opacity="0.75"/></marker><marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="arr-a-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#ea580c"/></marker></defs><rect x="20" y="50" width="230" height="250" rx="12" fill="none" stroke="currentColor" stroke-opacity="0.28" stroke-dasharray="5 5"/><text x="34" y="72" font-size="11" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="0.55">1  DATA (SYNTHETIC)</text><rect x="40" y="90" width="190" height="80" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="135.0" y="118.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Fact-set generator</text><text x="135.0" y="136.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">12 categories, 4 tiers</text><text x="135.0" y="151.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">sparse · medium · dense · tricky</text><rect x="40" y="190" width="190" height="90" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="135.0" y="223.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">400 train · 60 test</text><text x="135.0" y="241.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">test has 2 unseen categories</text><text x="135.0" y="256.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">no product in both splits</text><polyline points="135,170 135,190" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><rect x="300" y="50" width="620" height="250" rx="12" fill="none" stroke="currentColor" stroke-opacity="0.28" stroke-dasharray="5 5"/><text x="314" y="72" font-size="11" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="0.55">2  TEACHER WRITES, CHECKER + JUDGE DECIDE</text><rect x="320" y="100" width="190" height="100" rx="8" fill="#ea580c" fill-opacity="0.1" stroke="#ea580c" stroke-opacity="0.95"/><text x="415.0" y="131.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Teacher model</text><text x="415.0" y="149.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">Qwen3.5-397B on Tinker</text><text x="415.0" y="164.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">whole kit in one call</text><text x="415.0" y="179.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">+ audit by a second model (v2)</text><rect x="580" y="100" width="190" height="100" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="675.0" y="131.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Checker + judge</text><text x="675.0" y="149.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">code: claims, numbers (digits</text><text x="675.0" y="164.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">and words), forbidden words;</text><text x="675.0" y="179.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">Gemma 12B judge reads each kit</text><rect x="810" y="100" width="100" height="100" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="860.0" y="138.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Keep</text><text x="860.0" y="156.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">v2: 60 of 68</text><text x="860.0" y="171.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">kits passed</text><polyline points="250,235 300,235 300,150 320,150" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><text x="280.0" y="184.5" font-size="11" font-weight="400" text-anchor="end" fill="currentColor" fill-opacity="0.85" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">facts</text><polyline points="510,150 580,150" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><text x="545.0" y="142.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.85" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">draft kit</text><polyline points="770,150 810,150" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><text x="790.0" y="142.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.85" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">clean</text><polyline points="675,200 675,262 415,262 415,200" fill="none" stroke="#ea580c" stroke-opacity="1" stroke-width="2" marker-end="url(#arr-a)"/><text x="545.0" y="278.0" font-size="11" font-weight="400" text-anchor="middle" fill="#ea580c" fill-opacity="1" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">violations → revise (max 2 rounds), with the checker&#x27;s findings</text><text x="910" y="285" font-size="11" font-weight="400" text-anchor="end" fill="currentColor" fill-opacity="0.65">8 kits never got clean: dropped</text><rect x="960" y="50" width="640" height="250" rx="12" fill="none" stroke="currentColor" stroke-opacity="0.28" stroke-dasharray="5 5"/><text x="974" y="72" font-size="11" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="0.55">3  STUDENT LEARNS (TINKER, LORA)</text><rect x="980" y="100" width="190" height="100" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1075.0" y="131.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Per-part examples</text><text x="1075.0" y="149.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">v2: 319 chat examples</text><text x="1075.0" y="164.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">student prompt = the app&#x27;s</text><text x="1075.0" y="179.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">own prompt (no teacher note)</text><rect x="1190" y="100" width="190" height="100" rx="8" fill="#ea580c" fill-opacity="0.1" stroke="#ea580c" stroke-opacity="0.95"/><text x="1285.0" y="131.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">LoRA fine-tune</text><text x="1285.0" y="149.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">Qwen3.5-4B, rank 32</text><text x="1285.0" y="164.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">3 epochs, lr 2e-4, loss on</text><text x="1285.0" y="179.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">the answer tokens only</text><rect x="1400" y="100" width="180" height="100" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1490.0" y="131.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Checkpoint</text><text x="1490.0" y="149.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">tinker:// sampler</text><text x="1490.0" y="164.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">weights (a small LoRA</text><text x="1490.0" y="179.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">adapter, not a model)</text><polyline points="910,150 980,150" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><text x="945.0" y="142.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.85" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">per part</text><polyline points="1170,150 1190,150" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><polyline points="1380,150 1400,150" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><rect x="20" y="340" width="1580" height="290" rx="12" fill="none" stroke="currentColor" stroke-opacity="0.28" stroke-dasharray="5 5"/><text x="34" y="362" font-size="11" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="0.55">4  TEST IT, THEN DECIDE</text><rect x="40" y="390" width="270" height="110" rx="8" fill="#ea580c" fill-opacity="0.1" stroke="#ea580c" stroke-opacity="0.95"/><text x="175.0" y="426.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Sample on the 60 held-out kits</text><text x="175.0" y="444.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">same prompts as the app</text><text x="175.0" y="459.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">Tinker sampling, thinking off</text><text x="175.0" y="474.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">4.9 s per kit (hosted)</text><rect x="350" y="390" width="270" height="110" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="485.0" y="426.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Rescore every run, one checker</text><text x="485.0" y="444.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">old runs re-scored with today&#x27;s</text><text x="485.0" y="459.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">rules so numbers are comparable</text><text x="485.0" y="474.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">(v1: 93% old rules → 65%)</text><rect x="660" y="390" width="270" height="110" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="795.0" y="433.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Bootstrap 95% intervals</text><text x="795.0" y="451.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">clean-kit rate per model</text><text x="795.0" y="466.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">n = 60 · 2000 resamples</text><rect x="970" y="390" width="270" height="110" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1105.0" y="426.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Independent judge</text><text x="1105.0" y="444.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">Gemma 12B, n = 30 per model</text><text x="1105.0" y="459.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">different family from the teacher</text><text x="1105.0" y="474.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">result: a smaller gain (next figure)</text><rect x="1280" y="390" width="300" height="110" rx="8" fill="currentColor" fill-opacity="0.02" stroke="currentColor" stroke-opacity="0.55" stroke-dasharray="4 4"/><text x="1430.0" y="426.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="0.55">Local run</text><text x="1430.0" y="444.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">merge adapter → GGUF → ollama create</text><text x="1430.0" y="459.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">NOT done: the fine-tune is hosted</text><text x="1430.0" y="474.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">and not in the app&#x27;s default path</text><polyline points="1500,200 1500,340" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/><polyline points="310,445 350,445" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><polyline points="620,445 660,445" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><polyline points="930,445 970,445" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><polyline points="1240,445 1280,445" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/><text x="20" y="560" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">v1 scored 93% on a word-list checker the model had been trained against; the independent judge disagreed, which is why v2 exists.</text><text x="20" y="582" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">The 60 test products are never used to build training data (the teacher script refuses the test split).</text><text x="20" y="604" font-size="12" font-weight="400" text-anchor="start" fill="#ea580c" fill-opacity="0.9">Training spend was capped in code; Tinker&#x27;s usage page showed $5.41 of the $10 credit. All data is synthetic: no real seller data was used.</text></svg>