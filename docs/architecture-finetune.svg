<svg style="color:#1b1815;background:#ffffff;max-width:100%;height:auto" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 700" role="img" aria-label="A strong teacher writes copy, a code checker rejects anything that breaks the rules, and only clean kits train a small student that is then tested against the Gemma baselines on held-out products" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Fine-tuning loop</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" fill-opacity="0.75"/></marker><marker id="arr-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="currentColor" fill-opacity="0.75"/></marker><marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="arr-a-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#ea580c"/></marker></defs><rect x="20" y="50" width="230" height="250" rx="12" fill="none" stroke="currentColor" stroke-opacity="0.28" stroke-dasharray="5 5"/><text x="34" y="72" font-size="11" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="0.55">1  DATA (SYNTHETIC)</text><rect x="40" y="90" width="190" height="80" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="135.0" y="118.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Fact-set generator</text><text x="135.0" y="136.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">12 categories, 4 tiers</text><text x="135.0" y="151.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">sparse · medium · dense · tricky</text><rect x="40" y="190" width="190" height="90" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="135.0" y="223.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">400 train · 60 test</text><text x="135.0" y="241.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">test has 2 unseen categories</text><text x="135.0" y="256.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">no product in both splits</text><polyline points="135,170 135,190" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><rect x="300" y="50" width="620" height="250" rx="12" fill="none" stroke="currentColor" stroke-opacity="0.28" stroke-dasharray="5 5"/><text x="314" y="72" font-size="11" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="0.55">2  TEACHER WRITES, CHECKER JUDGES</text><rect x="320" y="100" width="190" height="100" rx="8" fill="#ea580c" fill-opacity="0.1" stroke="#ea580c" stroke-opacity="0.95"/><text x="415.0" y="131.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Teacher model</text><text x="415.0" y="149.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">Qwen3.5-397B on Tinker</text><text x="415.0" y="164.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">whole kit in one call</text><text x="415.0" y="179.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">+ tone and no-flattery note</text><rect x="580" y="100" width="190" height="100" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="675.0" y="131.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Deterministic checker</text><text x="675.0" y="149.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">unsupported claims · invented</text><text x="675.0" y="164.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">numbers · forbidden words ·</text><text x="675.0" y="179.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">placeholders · empty fields</text><rect x="810" y="100" width="100" height="100" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="860.0" y="138.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Keep</text><text x="860.0" y="156.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">79 of 84</text><text x="860.0" y="171.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">kits passed</text><polyline points="250,235 300,235 300,150 320,150" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><text x="280.0" y="184.5" font-size="11" font-weight="400" text-anchor="end" fill="currentColor" fill-opacity="0.85" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">facts</text><polyline points="510,150 580,150" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><text x="545.0" y="142.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.85" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">draft kit</text><polyline points="770,150 810,150" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><text x="790.0" y="142.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.85" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">clean</text><polyline points="675,200 675,262 415,262 415,200" fill="none" stroke="#ea580c" stroke-opacity="1" stroke-width="2" marker-end="url(#arr-a)"/><text x="545.0" y="278.0" font-size="11" font-weight="400" text-anchor="middle" fill="#ea580c" fill-opacity="1" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">violations → revise (max 2 rounds), with the checker&#x27;s findings</text><text x="910" y="285" font-size="11" font-weight="400" text-anchor="end" fill="currentColor" fill-opacity="0.65">5 kits never got clean: dropped</text><rect x="960" y="50" width="580" height="250" rx="12" fill="none" stroke="currentColor" stroke-opacity="0.28" stroke-dasharray="5 5"/><text x="974" y="72" font-size="11" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="0.55">3  STUDENT LEARNS (TINKER, LORA)</text><rect x="980" y="100" width="170" height="100" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1065.0" y="131.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Per-part examples</text><text x="1065.0" y="149.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">418 chat examples</text><text x="1065.0" y="164.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">student prompt = the app&#x27;s</text><text x="1065.0" y="179.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">own prompt (no teacher note)</text><rect x="1170" y="100" width="170" height="100" rx="8" fill="#ea580c" fill-opacity="0.1" stroke="#ea580c" stroke-opacity="0.95"/><text x="1255.0" y="131.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">LoRA fine-tune</text><text x="1255.0" y="149.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">Qwen3.5-4B, rank 32</text><text x="1255.0" y="164.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">3 epochs, loss on the</text><text x="1255.0" y="179.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">answer tokens only</text><rect x="1360" y="100" width="160" height="100" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1440.0" y="131.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Checkpoint</text><text x="1440.0" y="149.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">tinker:// sampler</text><text x="1440.0" y="164.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">weights (small LoRA</text><text x="1440.0" y="179.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">adapter, not a model)</text><polyline points="910,150 980,150" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><text x="945.0" y="142.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.85" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">per part</text><polyline points="1150,150 1170,150" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><polyline points="1340,150 1360,150" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><rect x="300" y="340" width="1240" height="330" rx="12" fill="none" stroke="currentColor" stroke-opacity="0.28" stroke-dasharray="5 5"/><text x="314" y="362" font-size="11" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="0.55">4  DOES IT WORK? SAME 60 HELD-OUT PRODUCTS, SAME CHECKER</text><rect x="330" y="390" width="220" height="110" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="440.0" y="426.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Gemma 3 4B (baseline)</text><text x="440.0" y="444.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">35% clean kits</text><text x="440.0" y="459.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">65% add an unsupported claim</text><text x="440.0" y="474.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">13.5 s per kit</text><rect x="580" y="390" width="220" height="110" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="690.0" y="426.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Gemma 3 12B (baseline)</text><text x="690.0" y="444.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">50% clean kits</text><text x="690.0" y="459.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">50% add an unsupported claim</text><text x="690.0" y="474.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">48.7 s per kit</text><rect x="830" y="390" width="250" height="110" rx="8" fill="#ea580c" fill-opacity="0.1" stroke="#ea580c" stroke-opacity="0.95"/><text x="955.0" y="426.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Fine-tuned Qwen3.5-4B</text><text x="955.0" y="444.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">goal: ≥ 85% clean</text><text x="955.0" y="459.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">at about 13 s per kit</text><text x="955.0" y="474.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">result: not measured yet</text><polyline points="1440,200 1440,330 955,330 955,390" fill="none" stroke="#ea580c" stroke-opacity="1" stroke-width="2" marker-end="url(#arr-a)"/><text x="1197.5" y="322.0" font-size="11" font-weight="400" text-anchor="middle" fill="#ea580c" fill-opacity="1" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">sample the checkpoint on the 60 test products</text><rect x="1120" y="390" width="190" height="110" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1215.0" y="433.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Honest read-out</text><text x="1215.0" y="451.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">blind pairs read by you</text><text x="1215.0" y="466.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">(is the copy duller?)</text><rect x="1340" y="390" width="170" height="110" rx="8" fill="currentColor" fill-opacity="0.02" stroke="currentColor" stroke-opacity="0.55" stroke-dasharray="4 4"/><text x="1425.0" y="426.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="0.55">Local run</text><text x="1425.0" y="444.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">merge adapter → GGUF</text><text x="1425.0" y="459.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">→ ollama create</text><text x="1425.0" y="474.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">not done yet</text><polyline points="1080,445 1120,445" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><polyline points="1310,445 1340,445" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/><text x="930" y="540" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.8">The checker is code, not an AI judge, so it cannot favour the teacher&#x27;s model family.</text><text x="930" y="560" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.8">The 60 test products are never used to build training data (the teacher script refuses the test split).</text><text x="930" y="600" font-size="11" font-weight="400" text-anchor="middle" fill="#ea580c" fill-opacity="0.8">Spend is capped in code. Teacher and training together used well under the $10 credit by the script&#x27;s conservative counter.</text></svg>