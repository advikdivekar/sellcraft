<svg style="color:#1b1815;background:#ffffff;max-width:100%;height:auto" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 960" role="img" aria-label="Facts become a seven-section prompt and a JSON schema, four core parts and one part per platform are written in parallel, then code validates, repairs only failed parts, and flags claims not in the facts" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Copy pipeline</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" fill-opacity="0.75"/></marker><marker id="arr-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="currentColor" fill-opacity="0.75"/></marker><marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="arr-a-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#ea580c"/></marker></defs><rect x="20" y="100" width="190" height="130" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="115.0" y="138.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Seller&#x27;s facts</text><text x="115.0" y="156.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">name · price · features</text><text x="115.0" y="171.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">benefits · materials · audience</text><text x="115.0" y="186.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">brand voice · words to avoid</text><text x="115.0" y="201.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">(blank means missing)</text><rect x="250" y="100" width="230" height="130" rx="8" fill="#ea580c" fill-opacity="0.1" stroke="#ea580c" stroke-opacity="0.95"/><text x="365.0" y="138.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Prompt, 7 sections</text><text x="365.0" y="156.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">FACTS · PLATFORM · TONE · STYLE</text><text x="365.0" y="171.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">OBJECTIVE · RULES · OUTPUT</text><text x="365.0" y="186.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">rules: only the facts, no</text><text x="365.0" y="201.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">placeholders, no assumed audience</text><rect x="520" y="100" width="200" height="130" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="620.0" y="146.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">JSON schema per part</text><text x="620.0" y="164.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">Ollama `format` = schema</text><text x="620.0" y="179.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">keys are fixed up front</text><text x="620.0" y="194.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">one JSON object per call</text><polyline points="210,165 250,165" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><polyline points="480,165 520,165" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><rect x="770" y="50" width="360" height="400" rx="12" fill="none" stroke="#ea580c" stroke-opacity="0.9" stroke-dasharray="5 5"/><text x="784" y="72" font-size="11" font-weight="700" text-anchor="start" fill="#ea580c" fill-opacity="1">4 CORE PARTS + 1 PER PLATFORM, IN PARALLEL</text><rect x="790" y="90" width="320" height="58" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="950.0" y="114.5" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">core 0 · listing</text><text x="950.0" y="132.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">title · short · full · audience</text><rect x="790" y="160" width="320" height="58" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="950.0" y="184.5" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">core 1 · discovery</text><text x="950.0" y="202.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">features · benefits · keywords · tags · SEO</text><rect x="790" y="230" width="320" height="58" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="950.0" y="254.5" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">core 2 · social</text><text x="950.0" y="272.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">caption · hashtags · headline · CTA · missing · claims</text><rect x="790" y="300" width="320" height="58" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="950.0" y="324.5" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">core 3 · video brief</text><text x="950.0" y="342.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">hook · voiceover · storyboard · motion prompt</text><rect x="790" y="370" width="320" height="58" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="950.0" y="394.5" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">platform:&lt;name&gt; × N</text><text x="950.0" y="412.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">Instagram · Facebook · Pinterest · Etsy · Shopify</text><polyline points="720,165 750,165 750,120 790,120" fill="none" stroke="#ea580c" stroke-opacity="1" stroke-width="2" marker-end="url(#arr-a)"/><text x="620" y="256" font-size="11" font-weight="400" text-anchor="middle" fill="#ea580c" fill-opacity="1.0" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">4 + N calls at once</text><rect x="1170" y="100" width="190" height="130" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="1265.0" y="146.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Merge and coerce</text><text x="1265.0" y="164.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">list-vs-string slips fixed</text><text x="1265.0" y="179.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">[placeholders] stripped</text><text x="1265.0" y="194.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">and flagged in place</text><rect x="1400" y="100" width="200" height="130" rx="8" fill="#ea580c" fill-opacity="0.1" stroke="#ea580c" stroke-opacity="0.95"/><text x="1500.0" y="146.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Validate</text><text x="1500.0" y="164.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">required fields present?</text><text x="1500.0" y="179.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">bad JSON → retry that call once</text><text x="1500.0" y="194.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">missing parts → redo ONLY them</text><polyline points="1110,165 1170,165" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><text x="1140.0" y="157.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.85" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">parts land</text><polyline points="1360,165 1400,165" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><rect x="20" y="500" width="1580" height="190" rx="12" fill="none" stroke="#ea580c" stroke-opacity="0.9" stroke-dasharray="5 5"/><text x="34" y="522" font-size="11" font-weight="700" text-anchor="start" fill="#ea580c" fill-opacity="1">POST-CHECK: CODE, NOT THE MODEL</text><rect x="40" y="540" width="300" height="130" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="190.0" y="578.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Rules</text><text x="190.0" y="596.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">forbidden words (seller&#x27;s list)</text><text x="190.0" y="611.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">RISKY: praise, audiences, occasions</text><text x="190.0" y="626.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">REGULATED: &#x27;clinically proven&#x27;…</text><text x="190.0" y="641.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">flag if absent from the facts</text><rect x="400" y="540" width="300" height="130" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="550.0" y="578.5" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Result</text><text x="550.0" y="596.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">copy shown in the editor</text><text x="550.0" y="611.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">&#x27;Double-check before posting&#x27;</text><text x="550.0" y="626.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">&#x27;Not provided, left out&#x27;</text><text x="550.0" y="641.5" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">nothing is silently deleted</text><rect x="760" y="540" width="300" height="130" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.55"/><text x="910.0" y="586.0" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor" fill-opacity="1">Sentry flag events</text><text x="910.0" y="604.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">rule · matched word · model</text><text x="910.0" y="619.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">prompt version · flag counts</text><text x="910.0" y="634.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">never the copy or the facts</text><polyline points="1500,230 1500,475 300,475 300,540" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><text x="900.0" y="467.0" font-size="11" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.85" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">validated copy</text><polyline points="340,605 400,605" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#arr)"/><polyline points="700,605 760,605" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/><text x="1100" y="600" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.8">Checks run again after every regenerate.</text><text x="1100" y="622" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.8">A flag never edits the copy: the seller decides.</text><text x="20" y="730" font-size="13" font-weight="700" text-anchor="start" fill="currentColor" fill-opacity="1.0">What the model is told, and what code enforces</text><text x="20" y="756" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">•  The model may only use the facts. Anything blank goes into missing_information, which the UI shows as &#x27;Not provided, so left out&#x27;.</text><text x="20" y="780" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">•  Tone and platform are separate prompt sections, so changing the tone rewrites the copy without touching the facts.</text><text x="20" y="804" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">•  Each part is small, so a bad part is retried alone. A leftover [placeholder] is stripped and flagged, never a second full round.</text><text x="20" y="828" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">•  The checker is plain code with word lists, so it cannot be talked out of a rule. It is also what the fine-tune was scored against.</text><text x="20" y="852" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">•  Temperature 0.4 for copy. The same prompts are used by the app, the teacher and the fine-tune, so the student learns the prompt it will get.</text><text x="20" y="876" font-size="12" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="0.9">•  A seller can regenerate one section with extra instructions; only that section&#x27;s call runs and the post-check runs again.</text><text x="20" y="920" font-size="11" font-weight="400" text-anchor="start" fill="#ea580c" fill-opacity="0.8">Limits: the word lists catch known phrases, not every unsupported statement. An independent judge on 30 kits shows what the lists miss (see the evaluation figure).</text></svg>