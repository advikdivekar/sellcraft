<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 600" width="860" height="600" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker></defs><rect width="860" height="600" fill="#ffffff"/><rect x="20" y="20" width="400" height="500" rx="14" fill="none" stroke="#8a8a8a" stroke-width="1.6" stroke-dasharray="6 6"/><text x="36" y="46" font-size="13" font-weight="700" text-anchor="start" fill="#8a8a8a" fill-opacity="1.0">SENTRY SEES (METADATA ONLY)</text><rect x="440" y="20" width="400" height="500" rx="14" fill="none" stroke="#ea580c" stroke-width="1.6" stroke-dasharray="6 6"/><text x="456" y="46" font-size="13" font-weight="700" text-anchor="start" fill="#ea580c" fill-opacity="1.0">SENTRY NEVER SEES</text><rect x="40" y="60" width="360" height="64" rx="10" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.8"/><text x="220.0" y="88.5" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">A span per model call</text><text x="220.0" y="112.5" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">model, token counts, latency</text><rect x="40" y="140" width="360" height="64" rx="10" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.8"/><text x="220.0" y="168.5" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">A transaction per job</text><text x="220.0" y="192.5" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">one for each generation job</text><rect x="40" y="220" width="360" height="64" rx="10" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.8"/><text x="220.0" y="248.5" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">An issue per flagged claim</text><text x="220.0" y="272.5" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">which rule fired, and how many</text><rect x="40" y="300" width="360" height="64" rx="10" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.8"/><text x="220.0" y="328.5" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">An event per seller report</text><text x="220.0" y="352.5" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">a section name + a fixed reason code</text><rect x="460" y="60" width="360" height="64" rx="10" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.8"/><text x="640.0" y="88.5" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">Product facts and copy</text><text x="640.0" y="112.5" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">never sent</text><rect x="460" y="140" width="360" height="64" rx="10" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.8"/><text x="640.0" y="168.5" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">Photos and prompts</text><text x="640.0" y="192.5" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">never sent</text><rect x="460" y="220" width="360" height="64" rx="10" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.8"/><text x="640.0" y="248.5" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">Free text from reports</text><text x="640.0" y="272.5" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">not collected at all</text><rect x="460" y="300" width="360" height="64" rx="10" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.8"/><text x="640.0" y="328.5" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">Anything not on the allow-list</text><text x="640.0" y="352.5" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">removed by the scrubber</text><text x="430" y="556" font-size="14" font-weight="600" text-anchor="middle" fill="#1b1815" fill-opacity="0.85">A canary test plants a fake product in every input path</text><text x="430" y="578" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.85">and fails if its marker reaches any outgoing payload.</text></svg>