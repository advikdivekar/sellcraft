<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 804" width="860" height="804" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker></defs><rect width="860" height="804" fill="#ffffff"/><rect x="130" y="20" width="600" height="84" rx="10" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.8"/><text x="430.0" y="58.5" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">Your facts</text><text x="430.0" y="82.5" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">name, price, features, and what&#x27;s missing</text><line x1="430.0" y1="104" x2="430.0" y2="130" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="130" y="130" width="600" height="84" rx="10" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.8"/><text x="430.0" y="158.0" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">Prompt + JSON schema</text><text x="430.0" y="182.0" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">7 sections: facts, platform, tone, style,</text><text x="430.0" y="203.0" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">objective, rules, output</text><line x1="430.0" y1="214" x2="430.0" y2="240" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="130" y="240" width="600" height="84" rx="10" fill="#fdeee3" stroke="#ea580c" stroke-width="1.8"/><text x="430.0" y="278.5" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">Small parts, in parallel</text><text x="430.0" y="302.5" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">4 core parts + 1 part per platform</text><line x1="430.0" y1="324" x2="430.0" y2="350" stroke="#ea580c" stroke-width="2" marker-end="url(#aa)"/><rect x="130" y="350" width="600" height="84" rx="10" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.8"/><text x="430.0" y="388.5" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">Merge</text><text x="430.0" y="412.5" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">every part is forced into strict JSON</text><line x1="430.0" y1="434" x2="430.0" y2="460" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="130" y="460" width="600" height="84" rx="10" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.8"/><text x="430.0" y="488.0" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">Validate</text><text x="430.0" y="512.0" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">a bad call is retried once;</text><text x="430.0" y="533.0" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">only the missing parts are redone</text><line x1="430.0" y1="544" x2="430.0" y2="570" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="130" y="570" width="600" height="84" rx="10" fill="#fdeee3" stroke="#ea580c" stroke-width="1.8"/><text x="430.0" y="598.0" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">Plain-code post-check</text><text x="430.0" y="622.0" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">forbidden words, invented numbers,</text><text x="430.0" y="643.0" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">unsupported claims</text><line x1="430.0" y1="654" x2="430.0" y2="680" stroke="#ea580c" stroke-width="2" marker-end="url(#aa)"/><rect x="130" y="680" width="600" height="84" rx="10" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.8"/><text x="430.0" y="718.5" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">Flags shown to the seller</text><text x="430.0" y="742.5" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">and sent to Sentry as metadata only</text></svg>