<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" width="860" height="560" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker></defs><rect width="860" height="560" fill="#ffffff"/><rect x="20" y="20" width="400" height="104" rx="10" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.8"/><text x="220.0" y="58.0" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">Gemma 3 4B</text><text x="220.0" y="82.0" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">Fast copy (the default)</text><text x="220.0" y="103.0" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">reads your photos</text><rect x="440" y="20" width="400" height="104" rx="10" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.8"/><text x="640.0" y="58.0" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">Gemma 3 12B</text><text x="640.0" y="82.0" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">Best-quality copy</text><text x="640.0" y="103.0" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">the independent judge</text><rect x="20" y="144" width="400" height="104" rx="10" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.8"/><text x="220.0" y="182.0" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">rembg (U2-Net)</text><text x="220.0" y="206.0" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">cuts the product out</text><text x="220.0" y="227.0" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">of its background</text><rect x="440" y="144" width="400" height="104" rx="10" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.8"/><text x="640.0" y="182.0" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">OpenCV, NumPy, Pillow</text><text x="640.0" y="206.0" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">measure, retouch, build the deck</text><text x="640.0" y="227.0" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">deterministic code</text><rect x="20" y="268" width="400" height="104" rx="10" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.8"/><text x="220.0" y="306.0" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">FFmpeg</text><text x="220.0" y="330.0" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">builds the 10-second video</text><text x="220.0" y="351.0" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">not generative video</text><rect x="440" y="268" width="400" height="104" rx="10" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.8"/><text x="640.0" y="306.0" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">Plain-code checker</text><text x="640.0" y="330.0" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">scores and flags the copy</text><text x="640.0" y="351.0" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">no model involved</text><rect x="20" y="392" width="400" height="104" rx="10" fill="#fdeee3" stroke="#ea580c" stroke-width="1.8"/><text x="220.0" y="430.0" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">Qwen3.5-4B + LoRA</text><text x="220.0" y="454.0" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">my fine-tuned copy writer</text><text x="220.0" y="475.0" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">hosted on Tinker, not in the app yet</text><text x="630" y="500" font-size="14" font-weight="700" text-anchor="middle" fill="#ea580c" fill-opacity="1.0">Orange runs on Tinker&#x27;s cloud.</text><text x="630" y="524" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.8">Everything else runs on your computer.</text></svg>