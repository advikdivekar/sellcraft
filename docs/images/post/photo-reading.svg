<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 454" width="860" height="454" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker></defs><rect width="860" height="454" fill="#ffffff"/><rect x="130" y="20" width="600" height="76" rx="10" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.8"/><text x="430.0" y="54.5" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">Up to 5 photos</text><text x="430.0" y="78.5" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">JPEG, PNG or WebP; type read from the bytes</text><line x1="430.0" y1="96" x2="430.0" y2="126" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="130" y="126" width="600" height="76" rx="10" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.8"/><text x="430.0" y="160.5" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">Shrunk to 768 px</text><text x="430.0" y="184.5" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">so the read is fast</text><line x1="430.0" y1="202" x2="430.0" y2="232" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="130" y="232" width="600" height="76" rx="10" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.8"/><text x="430.0" y="266.5" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">Gemma 3 4B reads them</text><text x="430.0" y="290.5" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">strict rules: copy what is there, never guess</text><line x1="430.0" y1="308" x2="430.0" y2="338" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="130" y="338" width="600" height="76" rx="10" fill="#fdeee3" stroke="#ea580c" stroke-width="1.8"/><text x="430.0" y="372.5" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">Suggestions only</text><text x="430.0" y="396.5" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">tagged &quot;From photo, check it&quot;; you confirm</text></svg>