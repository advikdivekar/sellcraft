<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 850" width="860" height="850" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker></defs><rect width="860" height="850" fill="#ffffff"/><rect x="180" y="20" width="500" height="74" rx="10" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.8"/><text x="430.0" y="53.5" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">Your photos + a few facts</text><text x="430.0" y="77.5" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">up to 5 photos, from your phone or laptop</text><line x1="430" y1="94" x2="215" y2="140" stroke="#ea580c" stroke-width="2" marker-end="url(#aa)"/><line x1="430" y1="94" x2="645" y2="140" stroke="#ea580c" stroke-width="2" marker-end="url(#aa)"/><text x="430" y="128" font-size="14" font-weight="700" text-anchor="middle" fill="#ea580c" fill-opacity="1.0">both lanes start at once</text><rect x="20" y="140" width="400" height="440" rx="14" fill="none" stroke="#ea580c" stroke-width="1.6" stroke-dasharray="6 6"/><text x="36" y="166" font-size="13" font-weight="700" text-anchor="start" fill="#ea580c" fill-opacity="1.0">VISUAL LANE</text><rect x="440" y="140" width="400" height="440" rx="14" fill="none" stroke="#ea580c" stroke-width="1.6" stroke-dasharray="6 6"/><text x="456" y="166" font-size="13" font-weight="700" text-anchor="start" fill="#ea580c" fill-opacity="1.0">LANGUAGE LANE</text><rect x="40" y="176" width="360" height="62" rx="10" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.8"/><text x="220.0" y="203.5" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">Measure each photo</text><text x="220.0" y="227.5" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">sharpness, brightness, noise</text><line x1="220" y1="238" x2="220" y2="254" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="254" width="360" height="62" rx="10" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.8"/><text x="220.0" y="281.5" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">Cut out the product</text><text x="220.0" y="305.5" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">rembg, at full resolution</text><line x1="220" y1="316" x2="220" y2="332" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="332" width="360" height="62" rx="10" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.8"/><text x="220.0" y="359.5" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">Refine the product pixels</text><text x="220.0" y="383.5" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">denoise, 2x upscale, contrast</text><line x1="220" y1="394" x2="220" y2="410" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="410" width="360" height="62" rx="10" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.8"/><text x="220.0" y="437.5" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">Pick a backdrop</text><text x="220.0" y="461.5" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">chosen from what the photo shows</text><line x1="220" y1="472" x2="220" y2="488" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="488" width="360" height="62" rx="10" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.8"/><text x="220.0" y="515.5" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">Render the studio shots</text><text x="220.0" y="539.5" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">still, marketplace photo, PNG</text><rect x="460" y="176" width="360" height="62" rx="10" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.8"/><text x="640.0" y="203.5" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">Build the prompt</text><text x="640.0" y="227.5" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">7 sections, JSON schema</text><line x1="640" y1="238" x2="640" y2="254" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="460" y="254" width="360" height="62" rx="10" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.8"/><text x="640.0" y="281.5" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">Write the copy in parallel parts</text><text x="640.0" y="305.5" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">4 core parts + 1 per platform</text><line x1="640" y1="316" x2="640" y2="332" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="460" y="332" width="360" height="62" rx="10" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.8"/><text x="640.0" y="359.5" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">Check the copy</text><text x="640.0" y="383.5" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">plain code: claims, numbers, words</text><line x1="640" y1="394" x2="640" y2="410" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="460" y="410" width="360" height="62" rx="10" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.8"/><text x="640.0" y="437.5" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">Show flags to the seller</text><text x="640.0" y="461.5" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">missing facts and risky claims</text><line x1="215" y1="580" x2="380" y2="626" stroke="#ea580c" stroke-width="2" marker-end="url(#aa)"/><line x1="645" y1="580" x2="480" y2="626" stroke="#ea580c" stroke-width="2" marker-end="url(#aa)"/><rect x="180" y="626" width="500" height="74" rx="10" fill="#fdeee3" stroke="#ea580c" stroke-width="1.8"/><text x="430.0" y="659.5" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">Image deck + 10-second video</text><text x="430.0" y="683.5" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">these need the finished copy and the studio shots</text><line x1="430" y1="700" x2="430" y2="736" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="180" y="736" width="500" height="74" rx="10" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.8"/><text x="430.0" y="769.5" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">Your kit: Overview, Copy, Photos, Share</text><text x="430.0" y="793.5" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">the page polls every 1.5 s and shows real progress</text></svg>