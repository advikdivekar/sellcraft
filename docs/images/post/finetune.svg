<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 698" width="860" height="698" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker></defs><rect width="860" height="698" fill="#ffffff"/><rect x="130" y="20" width="600" height="82" rx="10" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.8"/><text x="430.0" y="57.5" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">Teacher: Qwen3.5-397B-A17B</text><text x="430.0" y="81.5" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">writes marketing kits on Tinker</text><line x1="430.0" y1="102" x2="430.0" y2="128" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="130" y="128" width="600" height="82" rx="10" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.8"/><text x="430.0" y="155.0" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">Checker + independent judge</text><text x="430.0" y="179.0" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">reject any kit with an invented claim,</text><text x="430.0" y="200.0" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">number or forbidden word</text><line x1="430.0" y1="210" x2="430.0" y2="236" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="130" y="236" width="600" height="82" rx="10" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.8"/><text x="430.0" y="263.0" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">Revise</text><text x="430.0" y="287.0" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">the teacher fixes it using the findings</text><text x="430.0" y="308.0" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">(at most 2 rounds)</text><line x1="430.0" y1="318" x2="430.0" y2="344" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="130" y="344" width="600" height="82" rx="10" fill="#fdeee3" stroke="#ea580c" stroke-width="1.8"/><text x="430.0" y="381.5" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">Keep only clean kits</text><text x="430.0" y="405.5" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">319 kits with zero hard violations</text><line x1="430.0" y1="426" x2="430.0" y2="452" stroke="#ea580c" stroke-width="2" marker-end="url(#aa)"/><rect x="130" y="452" width="600" height="82" rx="10" fill="#fdeee3" stroke="#ea580c" stroke-width="1.8"/><text x="430.0" y="489.5" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">Train the student</text><text x="430.0" y="513.5" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">Qwen3.5-4B + LoRA, rank 32, 3 epochs</text><line x1="430.0" y1="534" x2="430.0" y2="560" stroke="#ea580c" stroke-width="2" marker-end="url(#aa)"/><rect x="130" y="560" width="600" height="82" rx="10" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.8"/><text x="430.0" y="597.5" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">Test on 60 held-out products</text><text x="430.0" y="621.5" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">the training code refuses to read them</text><text x="430" y="676" font-size="14" font-weight="700" text-anchor="middle" fill="#ea580c" fill-opacity="1.0">Spend: $5.41 of the $10 Tinker credit</text></svg>