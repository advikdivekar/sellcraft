<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 736" width="860" height="736" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker></defs><rect width="860" height="736" fill="#ffffff"/><rect x="130" y="20" width="600" height="76" rx="10" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.8"/><text x="430.0" y="54.5" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">Measure the photo</text><text x="430.0" y="78.5" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">sharpness, brightness, noise</text><line x1="430.0" y1="96" x2="430.0" y2="120" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="130" y="120" width="600" height="76" rx="10" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.8"/><text x="430.0" y="144.0" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">Cut out the product</text><text x="430.0" y="168.0" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">rembg; falls back to a framed photo</text><text x="430.0" y="189.0" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">if the cutout looks wrong</text><line x1="430.0" y1="196" x2="430.0" y2="220" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="130" y="220" width="600" height="76" rx="10" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.8"/><text x="430.0" y="254.5" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">Refine the product&#x27;s pixels</text><text x="430.0" y="278.5" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">denoise, 2x upscale, local contrast</text><line x1="430.0" y1="296" x2="430.0" y2="320" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="130" y="320" width="600" height="76" rx="10" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.8"/><text x="430.0" y="354.5" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">Fix the tone</text><text x="430.0" y="378.5" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">so the product reads clearly</text><line x1="430.0" y1="396" x2="430.0" y2="420" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="130" y="420" width="600" height="76" rx="10" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.8"/><text x="430.0" y="454.5" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">Choose a backdrop</text><text x="430.0" y="478.5" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">from what the photo shows</text><line x1="430.0" y1="496" x2="430.0" y2="520" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="130" y="520" width="600" height="76" rx="10" fill="#fdeee3" stroke="#ea580c" stroke-width="1.8"/><text x="430.0" y="554.5" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">Compose</text><text x="430.0" y="578.5" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">the product is never repainted</text><line x1="430.0" y1="596" x2="430.0" y2="620" stroke="#ea580c" stroke-width="2" marker-end="url(#aa)"/><rect x="130" y="620" width="600" height="76" rx="10" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.8"/><text x="430.0" y="644.0" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">Outputs</text><text x="430.0" y="668.0" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">studio still 1080x1350, white marketplace photo,</text><text x="430.0" y="689.0" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">transparent PNG, video layers, deck slides</text></svg>