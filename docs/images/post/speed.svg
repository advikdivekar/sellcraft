<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 476" width="860" height="476" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker></defs><rect width="860" height="476" fill="#ffffff"/><text x="20" y="38" font-size="16" font-weight="700" text-anchor="start" fill="#1b1815" fill-opacity="1.0">Writing the copy</text><text x="20" y="60" font-size="14" font-weight="400" text-anchor="start" fill="#1b1815" fill-opacity="0.75">Fast mode (Gemma 4B) as the default</text><rect x="20" y="72" width="560.0" height="30" rx="6" fill="#d9d9d9"/><text x="590.0" y="93" font-size="14" font-weight="400" text-anchor="start" fill="#1b1815" fill-opacity="1.0">before: 53 s</text><rect x="20" y="110" width="147.9245283018868" height="30" rx="6" fill="#ea580c"/><text x="177.9245283018868" y="131" font-size="14" font-weight="700" text-anchor="start" fill="#ea580c" fill-opacity="1.0">after: 14 s</text><text x="20" y="198" font-size="16" font-weight="700" text-anchor="start" fill="#1b1815" fill-opacity="1.0">One 12B call, split into parallel parts</text><rect x="20" y="210" width="560.0" height="30" rx="6" fill="#d9d9d9"/><text x="590.0" y="231" font-size="14" font-weight="400" text-anchor="start" fill="#1b1815" fill-opacity="1.0">before: 90 to 145 s</text><rect x="20" y="248" width="231.7241379310345" height="30" rx="6" fill="#ea580c"/><text x="261.72413793103453" y="269" font-size="14" font-weight="700" text-anchor="start" fill="#ea580c" fill-opacity="1.0">after: 45 to 60 s</text><text x="20" y="336" font-size="16" font-weight="700" text-anchor="start" fill="#1b1815" fill-opacity="1.0">Whole kit, four photos (Fast mode)</text><rect x="20" y="348" width="560.0" h