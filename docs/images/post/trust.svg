<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" width="860" height="560" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker></defs><rect width="860" height="560" fill="#ffffff"/><rect x="20" y="20" width="400" height="460" rx="14" fill="none" stroke="#8a8a8a" stroke-width="1.6" stroke-dasharray="6 6"/><text x="36" y="46" font-size="13" font-weight="700" text-anchor="start" fill="#8a8a8a" fill-opacity="1.0">STAYS ON YOUR COMPUTER</text><rect x="440" y="20" width="400" height="460" rx="14" fill="none" stroke="#ea580c" stroke-width="1.6" stroke-dasharray="6 6"/><text x="456" y="46" font-size="13" font-weight="700" text-anchor="start" fill="#ea580c" fill-opacity="1.0">CAN LEAVE (ONLY THESE)</text><rect x="40" y="60" width="360" height="64" rx="10" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.8"/><text x="220.0" y="88.5" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">Your photos and facts</text><text x="220.0" y="112.5" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">uploaded files, UUID names</text><rect x="40" y="140" width="360" height="64" rx="10" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.8"/><text x="220.0" y="168.5" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">All the Gemma calls</text><text x="220.0" y="192.5" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">through Ollama, on your computer</text><rect x="40" y="220" width="360" height="64" rx="10" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.8"/><text x="220.0" y="248.5" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">Studio photos, deck, video</text><text x="220.0" y="272.5" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">built locally with OpenCV and FFmpeg</text><rect x="40" y="300" width="360" height="64" rx="10" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.8"/><text x="220.0" y="328.5" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">Jobs, files, database</text><text x="220.0" y="352.5" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">SQLite and disk on your machine</text><rect x="460" y="60" width="360" height="64" rx="10" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.8"/><text x="640.0" y="88.5" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">A Shopify draft</text><text x="640.0" y="112.5" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">only when you tap it</text><rect x="460" y="140" width="360" height="64" rx="10" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.8"/><text x="640.0" y="168.5" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">Scrubbed Sentry metadata</text><text x="640.0" y="192.5" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">no product text, ever</text><text x="430" y="516" font-size="14" font-weight="600" text-anchor="middle" fill="#1b1815" fill-opacity="0.85">Not in the app: the fine-tune runs on Tinker today,</text><text x="430" y="538" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.85">so its inputs do leave. The default Gemma path stays local.</text></svg>