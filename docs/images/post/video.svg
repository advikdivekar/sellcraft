<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 552" width="860" height="552" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker></defs><rect width="860" height="552" fill="#ffffff"/><rect x="130" y="20" width="600" height="76" rx="10" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.8"/><text x="430.0" y="54.5" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">Plan at least 4 shots</text><text x="430.0" y="78.5" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">from your studio photos</text><line x1="430.0" y1="96" x2="430.0" y2="124" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="130" y="124" width="600" height="76" rx="10" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.8"/><text x="430.0" y="158.5" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">Render each shot with FFmpeg</text><text x="430.0" y="182.5" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">up to 3 at once</text><line x1="430.0" y1="200" x2="430.0" y2="228" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="130" y="228" width="600" height="76" rx="10" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.8"/><text x="430.0" y="262.5" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">Crossfade 0.4 s</text><text x="430.0" y="286.5" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">shots are joined into one clip</text><line x1="430.0" y1="304" x2="430.0" y2="332" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="130" y="332" width="600" height="76" rx="10" fill="#fdeee3" stroke="#ea580c" stroke-width="1.8"/><text x="430.0" y="366.5" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">Text cards from your copy</text><text x="430.0" y="390.5" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">edit the copy: only this layer re-renders</text><line x1="430.0" y1="408" x2="430.0" y2="436" stroke="#ea580c" stroke-width="2" marker-end="url(#aa)"/><rect x="130" y="436" width="600" height="76" rx="10" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.8"/><text x="430.0" y="470.5" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1815" fill-opacity="1.0">Check the result</text><text x="430.0" y="494.5" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1815" fill-opacity="0.78">10 s (plus or minus 0.5), 1080x1920</text></svg>